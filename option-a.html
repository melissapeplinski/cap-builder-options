<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Option A · Current CAP flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400..800&display=swap">
<style>
/* CAP Assessment Builder prototype. Tokens follow the CAP prototype's Cognia design system. */

:root{--background:#F9F9F9;--foreground:#000012;--card:#FFFFFF;--border:#EDEDEF;--card-border:#E7E7E7;--control-border:#E0E1E4;--ring:#C7C7CA;--primary:#111111;--secondary:#EDEDEF;--muted-text:#5B5B66;
--info:#007BBA;--info-light:#E5F2F8;--success:#0C8835;--success-light:#E7F3EB;--warning:#B95E04;--warning-light:#F8EFE6;--destructive:#DC2626;--coral:#FF554D;--tile:#D1D5EE;--tile-ink:#262E67;
--radius:8px;--radius-card:12px;--shadow-sm:0 1px 3px 0 rgba(0,0,0,.1),0 1px 2px -1px rgba(0,0,0,.1);--shadow-lg:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -4px rgba(0,0,0,.1)}
*{box-sizing:border-box}
body{margin:0;background:var(--background);color:var(--foreground);font:14px/1.5 'Open Sans',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
h1{font-size:33px;font-weight:600;letter-spacing:-.4px;line-height:1.2;margin:28px 0 6px}
h2{font-size:17px;font-weight:600;margin:0 0 6px}
h3{font-size:14px;font-weight:600;margin:0 0 4px}
p{margin:0 0 10px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--foreground);outline-offset:2px}
.muted{color:var(--muted-text)}.small{font-size:12px}
.lede{color:var(--muted-text);margin:0 0 24px;font-size:15px}
.hint{font-size:12px;color:var(--muted-text);margin:6px 0 10px;line-height:1.55}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted-text)}

/* Chrome */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;height:56px;padding:0 24px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:6}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px}
.topnav{display:flex;gap:4px;height:100%}
.topnav button{border:0;background:none;padding:0 10px;font-weight:600;font-size:13px;cursor:pointer;border-bottom:2px solid transparent}
.topnav button.active{border-bottom-color:var(--foreground)}
.topnav button:hover{background:rgba(0,0,0,.04)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--foreground);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.page{max-width:1400px;margin:0 auto;padding:22px 36px 140px}
.flowbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
.back{font-weight:600;text-decoration:none}
.stepper{display:flex;align-items:center;gap:10px;list-style:none;margin:0;padding:0;font-size:13px;font-weight:600}
.stepper li{display:flex;align-items:center;gap:8px;color:var(--muted-text)}
.stepper li.current,.stepper li.done{color:var(--foreground)}
.stepper .dot{width:28px;height:28px;border-radius:50%;border:1px solid var(--ring);display:grid;place-items:center;font-size:12px;background:var(--card)}
.stepper .current .dot,.stepper .done .dot{background:var(--primary);border-color:var(--primary);color:#fff}
.stepper .line{width:48px;height:1px;background:var(--ring)}
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 36px;background:var(--card);border-top:1px solid var(--border);box-shadow:0 -4px 14px rgba(0,0,0,.05)}
.bb-info{display:flex;align-items:center;gap:12px}
.bb-icon{width:40px;height:40px;border-radius:50%;background:var(--secondary);display:grid;place-items:center}
.bb-actions{display:flex;gap:8px;flex-wrap:wrap}

/* Building blocks */
.card{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius-card);padding:22px;margin-bottom:18px}
.btn{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;font-weight:600;padding:10px 18px;border-radius:var(--radius);border:1px solid var(--control-border);background:var(--card);color:#222;transition:background-color 150ms,border-color 150ms}
.btn:hover{background:#F4F4F5}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.primary:hover{background:#333}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:7px 12px}.btn.wide{width:100%;justify-content:center}
.btn-link{border:0;background:none;padding:0;cursor:pointer;font-weight:600;text-decoration:underline;text-underline-offset:2px}
.icon-btn{border:1px solid transparent;background:none;border-radius:6px;width:26px;height:26px;cursor:pointer;color:var(--muted-text)}
.icon-btn:hover:not(:disabled){background:var(--secondary);color:var(--foreground)}.icon-btn:disabled{opacity:.3}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--secondary);color:var(--foreground);white-space:nowrap}
.chip.success{background:var(--success-light);color:var(--success)}.chip.warning{background:var(--warning-light);color:var(--warning)}.chip.info{background:var(--info-light);color:var(--info)}
.chip.plus{background:var(--tile);color:var(--tile-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.row-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner{background:var(--info-light);color:#004E77;border-radius:var(--radius);padding:12px 14px;font-size:13px;margin-bottom:16px}
.notice{background:var(--warning-light);color:#7A3E02;border-radius:var(--radius);padding:12px 14px;font-size:13px;margin:12px 0}
.empty{text-align:center;padding:26px 12px;border:1px dashed var(--ring);border-radius:var(--radius);color:var(--muted-text)}
.empty strong{color:var(--foreground)}
label{display:block;font-weight:600;font-size:13px;margin:14px 0 6px}
input,select,textarea{width:100%;font:inherit;color:var(--foreground);background:var(--background);border:1px solid var(--border);border-radius:var(--radius);padding:9px 12px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--foreground);background:#fff}
textarea{resize:vertical;line-height:1.55}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--primary)}
label.check{display:flex;align-items:center;gap:8px;font-weight:600;margin:10px 0;cursor:pointer}
.radios{border:0;padding:0;margin:14px 0 0}.radios legend{font-weight:600;font-size:13px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field-row.three{grid-template-columns:repeat(3,1fr)}.field-row.four{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.grid-2{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}.grid-2.even{grid-template-columns:1fr 1fr}
.grid-3{display:grid;grid-template-columns:290px minmax(0,1fr) 360px;gap:20px;align-items:start}
.side{position:sticky;top:72px;max-height:calc(100vh - 170px);overflow:auto}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:12px}
.actions{display:flex;justify-content:flex-end;gap:10px}
.seg{display:inline-flex;background:var(--secondary);border-radius:var(--radius);padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:6px;font-weight:600;font-size:12px;cursor:pointer}
.seg button.on{background:var(--card);box-shadow:var(--shadow-sm)}
.seg.full{display:flex;margin-bottom:16px}.seg.full button{flex:1}
.count{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:var(--primary);color:#fff;font-size:10px;margin-left:4px}
.kv{list-style:none;padding:0;margin:0 0 6px}.kv li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}.kv li:last-child{border-bottom:0}
.warn-text{color:var(--warning)}
.bullets{margin:6px 0;padding-left:18px;font-size:13px;line-height:1.7}
.table{width:100%;border-collapse:collapse;font-size:13px}.table th{text-align:left;font-size:12px;color:var(--muted-text);font-weight:600;background:var(--background);padding:10px}.table td{padding:12px 10px;border-top:1px solid var(--border)}

/* Overview */
.hero-row{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:2px}
.stat strong{display:block;font-size:30px;font-weight:600;line-height:1.1}.stat span{display:block;font-weight:600;margin-top:4px}.stat small{color:var(--muted-text)}
.included{margin:8px 0 0;padding-left:18px;line-height:2}

/* Create: options, bank, assessment list */
.options{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:20px}
.option{position:relative;display:flex;gap:14px;align-items:flex-start;text-align:left;padding:20px;border:1px solid var(--card-border);border-radius:var(--radius-card);background:var(--card);cursor:pointer}
.option:hover{border-color:var(--ring)}
.option.selected{border-color:var(--foreground);background:#F4F4F5}
.option strong{display:block;font-size:16px;font-weight:600}.option small{display:block;color:var(--muted-text);margin-top:2px;font-size:12px}
.option-icon{font-size:20px;width:40px;height:40px;border-radius:10px;background:var(--tile);color:var(--tile-ink);display:grid;place-items:center;flex-shrink:0}
.option .chip{position:absolute;top:14px;right:14px}
.tick{position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:11px}
.bank-row,.qline{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:14px 0;border-top:1px solid var(--border)}
.bank-row p,.qline p{margin:6px 0 4px;font-size:13px}
.qline{justify-content:flex-start}.qline>div{flex:1;min-width:0}
.qnum{flex-shrink:0;width:26px;height:26px;border-radius:50%;border:1px solid var(--ring);display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--card)}

/* Item editor */
.editor-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.choice{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px;border:1px solid var(--border);border-radius:10px;margin-bottom:10px}
.choice.is-key{border-color:var(--success);background:#FBFEFC}
.letter{width:28px;height:28px;border-radius:50%;background:var(--secondary);display:grid;place-items:center;font-weight:700;font-size:12px;margin-top:4px}
.is-key .letter{background:var(--success);color:#fff}
.key-note{font-size:12px;font-weight:600;color:var(--success);margin-top:6px}
.rationale{margin-top:8px;font-size:13px;padding:7px 10px}
.suggest{font-size:12px;color:var(--info);margin-top:6px}.suggest .btn-link{font-size:12px}
.key-pick{display:flex;align-items:center;gap:6px;font-size:12px;margin:8px 0 0;cursor:pointer}
.support{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.support.on{border-color:var(--info);box-shadow:inset 3px 0 var(--info)}
.support .hint{margin:2px 0 0}
.switch{display:flex;align-items:center;gap:8px;margin:0;white-space:nowrap;cursor:pointer;font-size:12px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:16px}.compare h3{margin-bottom:8px}
.sq-frame{border:1px solid var(--border);border-radius:10px;padding:16px;background:var(--background)}

/* Item analysis */
.panel-title{font-size:17px;margin:4px 0 8px}
.meter{height:8px;border-radius:4px;background:var(--secondary);overflow:hidden;margin-bottom:12px}.meter div{height:100%;background:var(--success);border-radius:4px;transition:width 200ms}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 6px}
.metrics div{background:var(--background);border:1px solid var(--border);border-radius:var(--radius);padding:8px 4px;text-align:center}
.metrics strong{display:block;font-size:16px}.metrics span{font-size:11px;color:var(--muted-text)}
.checks{list-style:none;padding:0;margin:6px 0 0}
.checks li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--border);font-size:13px;line-height:1.45}
.checks small{display:block;color:var(--muted-text);margin-top:2px;font-size:12px}
.ci{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700}
.checks .pass .ci{background:var(--success-light);color:var(--success)}.checks .warn .ci{background:var(--warning-light);color:var(--warning)}.checks .info .ci{background:var(--info-light);color:var(--info)}
h3.sub{margin:18px 0 6px;font-size:13px}
.attention{list-style:none;padding:0;margin:0;font-size:13px}.attention li{padding:6px 0;border-bottom:1px solid var(--border)}
.dokbar{display:flex;height:22px;border-radius:6px;overflow:hidden;gap:2px;background:var(--secondary)}
.dok{display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
.d1{background:#9AA3D6}.d2{background:#4C58A8}.d3{background:var(--tile-ink)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--muted-text);margin-top:6px}.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}

/* Review */
.qnav-row{display:flex;align-items:flex-start;gap:4px;border:1px solid var(--border);border-radius:10px;margin-top:10px;padding:4px}
.qnav-row.current{border-color:var(--foreground);background:#F4F4F5}
.qnav-main{flex:1;min-width:0;display:flex;gap:10px;text-align:left;border:0;background:none;padding:8px;cursor:pointer}
.qnav-main>span:last-child{display:flex;flex-direction:column;align-items:flex-start;gap:5px;min-width:0}
.qtext{font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.reorder{display:flex;flex-direction:column}

/* Details and assign */
.tool-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0;border-top:1px solid var(--border)}.tool-row .hint{margin:2px 0 0}
.class-block{border:1px solid var(--border);border-radius:10px;padding:4px 14px 8px;margin-top:12px}
.class-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.student{border-top:1px solid var(--border);padding:4px 0}.student.off .check span{color:var(--muted-text)}
.student-main{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.student-main .check{margin:8px 0;font-weight:400}
.student-sups{margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.student-sups .btn-link{font-size:12px}
.picker{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 10px 26px}
.pick{border:1px solid var(--control-border);background:var(--card);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer}
.pick.on{background:var(--info-light);border-color:var(--info);color:var(--info)}

/* Student view */
.preview-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 24px;background:var(--foreground);color:#fff;font-size:13px}
.preview-bar label{margin:0 0 0 auto;font-weight:400}.preview-bar select{width:auto;padding:6px 10px;background:#fff}
.student-page{max-width:780px;margin:0 auto;padding:28px 20px 60px}
.qdots{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}
.qdots button{width:34px;height:34px;border-radius:50%;border:1px solid var(--ring);background:var(--card);cursor:pointer;font-weight:600}
.qdots button.answered{background:var(--secondary)}.qdots button.current{background:var(--primary);border-color:var(--primary);color:#fff}
.your-supports{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;margin-bottom:10px}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tool{border:1px solid var(--control-border);background:var(--card);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer}
.tool.on{background:var(--primary);border-color:var(--primary);color:#fff}
.sq-card{padding:28px}
.sq-stem{font-size:18px;line-height:1.6;margin:0 0 14px}
.sq-direction{font-size:12px;color:var(--muted-text);margin:14px 0 6px}
.sq-option{display:flex;width:100%;align-items:center;gap:12px;text-align:left;padding:12px 14px;margin:8px 0;border:1px solid var(--control-border);border-radius:10px;background:var(--card);cursor:pointer;font-size:15px}
.sq-option b{width:28px;height:28px;border-radius:50%;background:var(--secondary);display:grid;place-items:center;font-size:12px;flex-shrink:0}
.sq-option.picked{border-color:var(--foreground);box-shadow:inset 0 0 0 1px var(--foreground)}.sq-option.picked b{background:var(--primary);color:#fff}
.sq-frame .sq-stem{font-size:15px}.sq-frame .sq-option{font-size:13px;padding:8px 10px;cursor:default}
.sq-response{background:#fff}
.listen{margin-bottom:12px}
.sq-help{background:var(--info-light);border-radius:var(--radius);padding:10px 14px;font-size:13px;line-height:1.6;margin:12px 0}
.sq-hint{margin-top:14px;font-size:13px}.sq-hint summary{cursor:pointer;font-weight:600}.sq-hint p{margin:6px 0}
.sq-challenge{border-left:3px solid var(--tile-ink);background:#F1F2FA;padding:10px 14px;border-radius:var(--radius);margin-top:14px;font-size:13px}
.sq-foot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.fraction-bars{display:flex;flex-wrap:wrap;gap:16px;margin:10px 0}
.fraction-bars figure{margin:0}.fraction-bars figcaption{font-size:12px;font-weight:700;margin-bottom:4px}
.fraction-bars svg{display:block;max-width:100%;height:auto;margin-bottom:4px}
.bar-fill{fill:var(--tile-ink)}.bar-empty{fill:#fff;stroke:#9AA3D6}

/* Standards (knowledge graph) */
.std-results{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto;margin-top:8px}
.std-result{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);cursor:pointer;font-size:13px}
.std-result:hover{border-color:var(--ring)}.std-result.on{border-color:var(--foreground);background:#F4F4F5}
.std-result small{color:var(--muted-text)}
.progression{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:start}
.progression .chip{white-space:normal;max-width:100%}
.progression>div{display:flex;flex-direction:column;align-items:flex-start;gap:5px}.progression small{color:var(--muted-text);font-size:11px}
.progression>span{margin-top:18px;color:var(--muted-text)}
.source{font-size:11px;color:var(--muted-text);margin:14px 0 0}
.components{border:1px solid var(--border);border-radius:var(--radius);padding:4px 14px 10px;margin:14px 0 0}
.components legend{font-weight:600;font-size:13px;padding:0 4px}.hint-inline{font-weight:400;color:var(--muted-text);font-size:12px}
.components .source{margin-top:4px}
.check.comp{font-weight:400;margin:7px 0;font-size:13px}
/* Cognia items and read-only originals */
.banner.neutral{background:var(--secondary);color:var(--foreground)}
.mini{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px 0;border-top:1px solid var(--border)}
.mini p{margin:0 0 6px;font-size:13px}.reason{font-size:11px;font-weight:700;color:var(--info);margin-bottom:3px}
.ro-stem{font-size:16px;margin:16px 0 10px}
.choice.ro{grid-template-columns:28px minmax(0,1fr)}
.fix{margin-top:8px}
/* Results */
.stats.four{grid-template-columns:repeat(4,1fr);margin-bottom:18px}
.stat small{display:block;margin-top:2px}
.results-tabs{margin-bottom:14px}
.group-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:10px}
.group h2{font-size:19px}
.notice.prereq{margin-bottom:0}
.rbar{height:10px;border-radius:5px;background:var(--secondary);overflow:hidden;min-width:80px}
.rbar div{height:100%;border-radius:5px;background:var(--success)}
.rbar.mid div{background:#D99A3E}.rbar.low div{background:var(--warning)}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,240px) 48px;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--border)}
.rrow:first-child{border-top:0}
.rpct{text-align:right;font-size:16px}
.tcell-bar{width:160px}
.qstem{margin:6px 0 10px;font-size:15px}
.optrow{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(80px,200px) 24px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--border)}
.optrow:first-of-type{margin-top:12px}
.optrow.key .letter{background:var(--success);color:#fff}
.optbar{height:8px;border-radius:4px;background:var(--secondary);overflow:hidden}.optbar div{height:100%;background:var(--tile-ink)}
.optrow.key .optbar div{background:var(--success)}
@media(max-width:900px){.stats.four{grid-template-columns:1fr 1fr}.group-head{flex-direction:column}}

@media(max-width:900px){.grid-2,.grid-2.even,.grid-3{grid-template-columns:1fr}.side{position:static;max-height:none}.options,.stats{grid-template-columns:1fr}.topnav{display:none}.flowbar{grid-template-columns:1fr}.stepper{justify-content:flex-start}}
@media(max-width:640px){.page{padding:16px 16px 190px}.field-row,.field-row.three,.field-row.four,.compare{grid-template-columns:1fr}.bottombar{flex-direction:column;align-items:stretch;padding:12px 16px}.bb-actions{justify-content:flex-end}h1{font-size:26px}.hero-row{flex-direction:column;align-items:flex-start}.stepper .line{width:16px}.choice{grid-template-columns:28px minmax(0,1fr)}.key-pick{grid-column:2}}

/* Updates aligned with the current CAP prototype: overview entry cards, recent list, assign and results summaries */
.entry-card{display:flex;flex-direction:column;align-items:flex-start;gap:6px}.entry-card h2{margin:0}.entry-card p{margin:0 0 8px}
.recent-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--border)}.recent-row:first-of-type{border-top:0}.recent-row>div{flex:1}.recent-row p{margin:2px 0 0}
.selection-summary{margin:-6px 0 16px;padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:var(--card);font-size:14px}

/* CAP refresh (Nov 2026): larger page titles with the stepper beside them, 48px controls,
   lavender done-states with a blue-violet accent, icon stat tiles, and the new overview dashboard. */
:root{--accent:#4F5CBE;--accent-light:#EEF0FA;--lede:#3E3E4B;--card-border:#E7E7E9}
h1{font-size:48px;font-weight:700;letter-spacing:-.8px;line-height:1.15;margin:0 0 8px}
.lede{color:var(--lede);font-size:16px;margin:0}
.card{border-radius:var(--radius);padding:20px}
h2{font-size:16px;font-weight:700}
.section-title{font-size:16px;font-weight:700;margin:24px 0 12px}
.topnav button.active{border-bottom-color:var(--coral)}
.top-right{display:flex;align-items:center;gap:16px}.apps{fill:var(--foreground)}
.backrow{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin:8px 0 24px}
.page-head>.btn{margin-top:8px}
.stepper{gap:0;font-size:14px;font-weight:400;flex-shrink:0}
.stepper li:not(.line){flex-direction:column;gap:6px;width:64px;color:var(--lede)}
.stepper li.current{font-weight:600;color:var(--foreground)}
.stepper .dot{width:40px;height:40px;font-size:14px;font-weight:600;border:1px solid var(--border);background:var(--card);color:var(--foreground)}
.stepper .done .dot{background:var(--tile);border-color:var(--tile);color:var(--foreground)}
.stepper .current .dot{background:var(--foreground);border-color:var(--foreground);color:#fff}
.stepper .line{width:72px;height:2px;border-radius:2px;background:var(--border);margin:0 -4px 26px}.stepper .line.done{background:var(--accent)}
input,select,textarea{background:#fff;border-color:var(--ring);padding:12px 14px}
input,select{min-height:48px}
input[type=checkbox],input[type=radio]{min-height:0}
label{font-size:14px;color:var(--lede)}
.btn{font-size:14px;padding:11px 18px}.btn.sm{font-size:12px;padding:7px 12px}
.btn.ghost{border-color:transparent;background:none}.btn.ghost:hover{background:var(--secondary)}
.btn.lg,.bb-actions .btn{min-height:48px;padding:12px 20px}
.option.selected,.std-result.on,.qnav-row.current{border-color:var(--accent);background:var(--accent-light)}
.tick{background:var(--accent)}
.seg button.on{color:var(--foreground)}
details.optional{border-radius:var(--radius);background:var(--accent-light);margin-top:18px;padding:0 16px}
details.optional summary{cursor:pointer;font-weight:600;padding:14px 0}
details.optional[open]{padding-bottom:14px}

/* Overview dashboard */
.priorities{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}
.priority{display:flex;flex-direction:column;gap:12px;margin:0;background:linear-gradient(180deg,var(--accent-light) 0,var(--card) 64px)}
.priority-top{display:flex;gap:12px;align-items:flex-start}.priority-top h2{margin:0}.priority-top p{margin:2px 0 0}
.priority-body{flex:1}.priority-body .meter{margin:6px 0 0}.priority-body .meter div{background:var(--accent)}
.priority>.btn{align-self:flex-start}
.big-num{font-size:28px;font-weight:700;display:flex;align-items:center;gap:10px}
.stat-icon{flex-shrink:0;width:40px;height:40px;border-radius:var(--radius);background:var(--tile);color:var(--tile-ink);display:grid;place-items:center;font-size:16px;font-weight:700}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:16px 0}
.week div{text-align:center;padding:10px 4px;border-radius:var(--radius)}.week small{display:block;color:var(--muted-text)}.week strong{font-size:15px}
.week .today{background:var(--tile)}
.events{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.event{border:1px solid var(--card-border);border-radius:var(--radius);padding:14px;display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px 12px}
.event.mine{border-color:var(--accent);background:var(--accent-light)}
.event-date{text-align:center;border:1px solid var(--border);border-radius:var(--radius);padding:4px 0;background:#fff}.event-date small{display:block;font-size:11px;color:var(--muted-text)}.event-date strong{font-size:17px}
.event strong{display:block;margin-bottom:4px}
.event-foot{grid-column:1/-1;display:flex;justify-content:space-between;font-size:12px;color:var(--muted-text)}

/* Setup, details, assign, confirm */
.promo{background:linear-gradient(135deg,var(--accent-light),var(--card) 70%)}
.promo-steps{list-style:none;counter-reset:s;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0;margin:14px 0 0}
.promo-steps li{counter-increment:s;text-align:center;font-size:13px}.promo-steps li::before{content:counter(s);display:grid;place-items:center;width:32px;height:32px;margin:0 auto 6px;border-radius:50%;background:var(--tile);font-weight:700}
.promo-steps small{display:block;color:var(--muted-text);font-size:11px}
.test-bar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.test-tab{display:flex;align-items:center;gap:12px;padding:12px 16px;border:1px solid var(--card-border);border-radius:var(--radius);background:var(--card);min-width:260px}
.test-tab.on{border-color:var(--accent);background:var(--accent-light)}
.test-tab small{display:block;color:var(--muted-text)}
.test-number{width:28px;height:28px;border-radius:50%;background:var(--secondary);display:grid;place-items:center;font-weight:600;flex-shrink:0}
.set-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:12px;align-items:center;padding:6px 0}.set-row label{margin:0}
label.check.ack{margin:4px 0 0;padding:14px 16px;background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius)}
.tests-card .test-tab{margin-top:10px}
.class-block.on{border-color:var(--accent)}
.session{border:1px solid var(--card-border);border-radius:var(--radius);padding:14px 16px;margin-top:12px;background:linear-gradient(180deg,var(--accent-light) 0,var(--card) 52px)}
.duration{margin:12px 0 0;font-weight:600}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:12px 0}
.facts small{display:block;color:var(--muted-text)}
.qline .chip{flex-shrink:0}
.page.narrow{max-width:820px}
.done-hero{text-align:center;margin:24px 0}.done-hero .added-check{width:56px;height:56px;font-size:24px;margin:0 auto 16px}
.actions.center{justify-content:center}

/* Results */
.stat.tile{display:flex;gap:14px;align-items:flex-start;margin:0}
.stat.tile span{margin:0;color:var(--lede);font-weight:600}.stat.tile strong{font-size:26px;margin-top:2px}
.results-meta{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.session-card{display:grid;grid-template-columns:auto 1fr auto;gap:28px;align-items:center}.session-card .code{font-size:28px;letter-spacing:1px}
.results-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin:18px 0}.results-row .card{margin:0}
.histogram{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:150px;margin-top:12px}
.histogram div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:12px}
.histogram i{display:block;width:70%;min-height:2px;border-radius:4px 4px 0 0;background:var(--accent)}.histogram small{color:var(--muted-text);font-size:11px}
.perf{display:grid;grid-template-columns:28px minmax(0,1fr) 44px;gap:10px;align-items:center;padding:6px 0;font-size:13px}.perf strong{text-align:right}
.insights .checks{margin-bottom:10px}
.insights-section{margin:24px 0}.insights-section>.row{margin-bottom:12px;align-items:flex-end}.insights-section .section-title{margin:0 0 2px}
.results-links{margin:10px 0 6px}

@media(max-width:1100px){.priorities,.results-row{grid-template-columns:1fr}.session-card{grid-template-columns:1fr}}
@media(max-width:900px){.page-head{flex-direction:column}.stepper{align-self:flex-start}.week{grid-template-columns:repeat(4,1fr)}.results-meta{text-align:left;align-items:flex-start}}
@media(max-width:640px){h1{font-size:32px}.stepper .line{width:24px}.set-row{grid-template-columns:1fr}.test-tab{min-width:0;width:100%}}

/* Alabama state standards pathway */
.al-banner{margin:12px 0 0}.al-banner div{margin-top:2px}
.why-locked{margin:12px 0 0;padding:10px 14px;border-radius:var(--radius);background:var(--warning-light);color:#7A3E02}.why-locked summary{cursor:pointer;font-weight:600}.why-locked p{margin:6px 0 0}
label.check.demo-switch{font-weight:400;font-size:12px;color:var(--muted-text);margin:10px 0 0}

/* ELA: passages beside or above items, the passage step in the editor, graphic organizers */
.passage-pick,.passage-field{border:1px solid var(--card-border);border-radius:var(--radius);padding:14px 16px;margin:8px 0 14px;background:linear-gradient(180deg,var(--accent-light) 0,var(--card) 56px)}
.passage-pick h3,.passage-field h3{font-size:16px;margin:2px 0}.cognia-head{margin:16px 0 0}
.passage-peek{margin:10px 0}.passage-peek summary{cursor:pointer;font-weight:600;font-size:13px}
.passage{font-size:15px;line-height:1.7;max-height:420px;overflow:auto;padding:14px 16px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;margin-top:8px}
.passage h3{font-size:17px;margin:0 0 10px}.passage p{display:grid;grid-template-columns:24px 1fr;gap:6px;margin:0 0 12px}
.pnum{font-size:11px;font-weight:700;color:var(--muted-text);padding-top:4px}
.passage-note{display:block;margin:-2px 0 4px}
.sq-split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
.passage-pane .passage{max-height:calc(100vh - 220px)}
.student-page:has(.sq-split){max-width:1180px}
.organizer{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.org-box{border:1px dashed var(--accent);border-radius:var(--radius);padding:10px;background:var(--accent-light);font-size:12px;display:flex;flex-direction:column;gap:6px}
.org-box span{display:block;height:28px;border-bottom:1px solid var(--ring)}.org-box textarea{min-height:52px;font-size:13px;padding:6px 8px}
@media(max-width:900px){.sq-split{grid-template-columns:1fr}}

/* CAP refresh (Nov 4 2026): 24px page titles, filled grey inputs, borderless white cards, priorities columns,
   a month calendar, the Assessments list and the Item Bank (list with detail panel, or a sortable table). */
h1{font-size:24px;font-weight:700;letter-spacing:0;line-height:1.3;margin:0 0 4px}
.lede{font-size:14px}
.card{border:0;border-radius:var(--radius-card);box-shadow:none}
input:not([type=checkbox]):not([type=radio]),select,textarea{background:#EDEDEF;border:1px solid transparent;border-radius:var(--radius)}
input:not([type=checkbox]):not([type=radio]):focus,select:focus,textarea:focus{background:#fff;border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-light)}
input[readonly]{color:var(--muted-text)}
.btn.primary{background:var(--foreground);border-color:var(--foreground)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.chip.danger{background:#FDECEC;color:var(--destructive)}
.icon-btn{width:36px;height:36px;font-size:16px;color:var(--foreground)}.icon-btn.on{background:var(--secondary)}
.page-head{align-items:center}

/* Priorities columns (Overview and Assessments) */
.pcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-bottom:20px}
.pcol-tab{display:inline-flex;align-items:center;gap:8px;font-weight:600;padding:8px 40px 8px 16px;border-radius:10px 10px 0 0;clip-path:polygon(0 0,82% 0,100% 100%,0 100%);margin-bottom:-1px}
.pcol-tab .count{background:#fff;color:var(--foreground);display:inline-block;min-width:20px;height:auto;line-height:18px;text-align:center;border-radius:999px;font-size:11px;padding:0 7px}
.pcol-body{border-radius:0 12px 12px 12px;padding:12px;display:grid;gap:10px}
.pcol.drafts .pcol-tab,.pcol.drafts .pcol-body{background:#E3E6F6}
.pcol.review .pcol-tab,.pcol.review .pcol-body{background:#FBE7E6}
.pcol.done .pcol-tab,.pcol.done .pcol-body{background:#E4F2E8}
.pitem{background:var(--card);border-radius:10px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 12px;align-items:center}
.pitem-head{border-left:3px solid;padding-left:12px}.pitem-head strong,.pitem-head small{display:block}.pitem-head small{color:var(--muted-text)}
.pitem.amber .pitem-head{border-color:#D08A2C}.pitem.red .pitem-head{border-color:var(--destructive)}.pitem.green .pitem-head{border-color:var(--success)}
.pitem-body{grid-column:1/-1}.pitem-body .meter{margin:4px 0 0;max-width:180px}.pitem-body .meter div{background:var(--accent)}
.pitem:has(.pitem-body)>.btn{grid-column:2;grid-row:2;align-self:end}
.pitem:has(.pitem-body) .pitem-body{grid-column:1;grid-row:2}

/* Month calendar and day panel */
.ov-grid{align-items:start}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--border);border-left:1px solid var(--border);margin-top:12px}
.cal-dow{text-align:center;font-size:12px;font-weight:600;color:var(--muted-text);padding:8px 0;border-right:1px solid var(--border);border-bottom:1px solid var(--border);text-transform:uppercase}
.cal-cell{min-height:64px;border:0;border-right:1px solid var(--border);border-bottom:1px solid var(--border);background:none;padding:6px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;cursor:pointer;text-align:left}
.cal-cell.empty{cursor:default;background:#FBFBFB}.cal-cell:hover:not(.empty){background:var(--background)}
.cal-cell.sel{background:var(--accent-light);box-shadow:inset 0 0 0 2px var(--accent)}
.cal-num{font-size:13px;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.cal-cell.today .cal-num{border:1.5px solid var(--foreground)}.cal-cell.sel .cal-num{background:var(--accent);color:#fff;border-color:var(--accent)}
.cal-ev{font-size:11px;border-left:3px solid var(--accent);background:#fff;padding:0 4px;border-radius:2px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}.cal-ev.mine{border-color:var(--coral)}
.day-ev{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--background);border-radius:10px;padding:10px 12px;margin-top:10px}
.day-ev.mine{background:var(--accent-light)}.day-ev small{display:block;color:var(--muted-text)}
.day-time{background:var(--tile);border-radius:6px;padding:8px 10px;font-weight:600;font-size:13px}
.snapshot{margin-top:20px}.snapshot h3{margin:0}
.snap-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.snap-tiles div{border-left:3px solid var(--accent);background:var(--background);border-radius:6px;padding:8px 12px;color:var(--muted-text)}.snap-tiles strong{font-size:22px;color:var(--foreground);margin-right:6px}
.snap-tiles .pending{border-color:#D08A2C}.snap-tiles .missing{border-color:var(--destructive)}
.snap-bar{display:flex;height:24px;border-radius:6px;overflow:hidden;font-size:11px;font-weight:600}
.snap-bar span{display:grid;place-items:center;background:var(--accent);color:#fff;white-space:nowrap;overflow:hidden}.snap-bar .pending{background:#F8EFE6;color:var(--warning)}.snap-bar .missing{background:#FDECEC;color:var(--destructive)}

/* Assessments list */
.as-head h1{display:flex;align-items:center;gap:12px;margin:0}
.title-icon{width:44px;height:44px;border-radius:10px;background:var(--card);display:grid;place-items:center;font-size:18px}
.entry-tiles{display:flex;gap:12px;flex-wrap:wrap}
.entry-tile{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;min-width:260px;background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:14px 16px;text-align:left;font-weight:400;cursor:pointer}
.entry-tile strong{font-weight:600;line-height:1.35}.entry-tile:hover{box-shadow:var(--shadow-lg)}
.as-tools{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.seg.underline{background:none;padding:0;gap:16px}.seg.underline button{border-radius:0;padding:8px 2px;box-shadow:none;border-bottom:2px solid transparent;font-size:13px}.seg.underline button.on{border-bottom-color:var(--coral)}
.pill-search{border-radius:999px!important;min-width:240px;flex:1;max-width:340px;min-height:40px!important;padding:8px 16px}
.pills{display:flex;gap:6px;margin-left:auto}
.pill{border:0;background:none;border-radius:999px;padding:7px 14px;font-weight:600;font-size:12px;cursor:pointer}.pill.on{background:var(--tile);color:var(--tile-ink)}.pill:hover:not(.on){background:var(--secondary)}
.as-table td{vertical-align:middle}.as-table tr.mine td{background:var(--accent-light)}.row-title{font-weight:600;text-decoration:none;color:var(--foreground)}

/* Item Bank */
.ib{display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);gap:24px;align-items:start}
.ib.expanded{grid-template-columns:1fr}
.ib-bar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.ib-icons{display:flex;gap:4px}
.icon-btn[data-tip]{position:relative}.icon-btn[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#fff;color:var(--foreground);box-shadow:var(--shadow-lg);border-radius:6px;padding:4px 8px;font-size:11px;white-space:nowrap;z-index:3}
.ib-filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;animation:ib-in 200ms ease}
@keyframes ib-in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.ib-filters .pill-search{max-width:none}
.ib-menu{position:relative}.ib-menu summary{list-style:none;cursor:pointer;background:var(--card);border:1px solid var(--card-border);border-radius:999px;padding:8px 14px;font-weight:600;font-size:12px}
.ib-menu-list{position:absolute;top:calc(100% + 4px);left:0;z-index:4;background:#fff;border-radius:10px;box-shadow:var(--shadow-lg);padding:8px 12px;min-width:200px}
.ib-chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}.chip.removable{border:0;cursor:pointer;font-size:12px;padding:4px 10px}
.ib-count{text-align:right;margin:10px 0 6px}
.ib-scroll{max-height:calc(100vh - 220px);overflow:auto;display:grid;gap:2px;padding-right:4px}
.ib-row{display:grid;gap:4px;justify-items:start;text-align:left;border:0;background:none;border-radius:10px;padding:12px;cursor:pointer}
.ib-row:hover{background:var(--card)}.ib-row.sel{background:var(--card);box-shadow:inset 3px 0 0 var(--accent)}

<script>window.CAP_OPTION={id:'A',name:'Current CAP flow',store:'cap-option-a-v1'};</script>
<script>
// Item analysis engine: quality checks, answer-key verification, misconception detection
// and learner-support generation for teacher-written items. Rule-based, no AI calls, no UI.

const IA=(()=>{
const letters=['A','B','C','D'];
const units=/\b(cups?|miles?|yards?|gallons?|inch(?:es)?|feet|foot|pounds?|ounces?|hours?|minutes?|liters?|meters?|pizzas?|pies?|laps?|pages?|bags?)\b/i;
const denomNames={2:['half','halves'],3:['third','thirds'],4:['fourth','fourths'],5:['fifth','fifths'],6:['sixth','sixths'],7:['seventh','sevenths'],8:['eighth','eighths'],9:['ninth','ninths'],10:['tenth','tenths'],12:['twelfth','twelfths']};
const plainWords=[[/\bdetermine\b/gi,'find'],[/\bcalculate\b/gi,'find'],[/\baltogether\b/gi,'in all'],[/\bcombines\b/gi,'mixes'],[/\bremaining\b/gi,'left'],[/\bapproximately\b/gi,'about'],[/\bin order to\b/gi,'to'],[/\bthe total amount of\b/gi,'how much'],[/\bWhich of the following\b/g,'Which'],[/\bpurchases\b/gi,'buys'],[/\butilizes\b/gi,'uses'],[/\bthat (she|he|they) will\b/gi,'$1 will']];
const glossaryTerms={fraction:'A number that names part of a whole, like 2/3.',denominator:'The bottom number in a fraction. It tells how many equal parts make one whole.',numerator:'The top number in a fraction. It tells how many parts you have.',sum:'The answer when you add.',total:'How much in all. Usually means add.',altogether:'In all. Usually means add.','in all':'Put together. Usually means add.',combine:'Put together.',mixes:'Puts things together.',difference:'The answer when you subtract.',remain:'Be left over after some is taken away.',left:'What is still there after some is taken away.','mixed number':'A whole number and a fraction together, like 1 1/2.',equivalent:'Equal in value, like 1/2 and 2/4.'};
const keyIssues=['Answer key may be wrong','Two correct answers','No choice matches the answer'];
// Contexts that can be unfamiliar or uncomfortable for some students. A starting list, not a full sensitivity review.
const sensitive=/\b(christmas|easter|hanukkah|church|mosque|temple|guns?|hunting|alcohol|beer|wine|casino|gambling|lottery|yachts?|mansions?|ski trip|vacation home|divorce[ds]?|death|died|funeral|diet(ing)?|weight loss)\b/i;
const visualRef=/\b(picture|image|diagram|graph|chart|figure|shown|shaded|below|above)\b/i;
const colorRef=/\b(red|blue|green|yellow|orange|purple)\b/i;

function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

// Fractions are {n,d} in lowest terms. Fractions found in a stem also keep their whole part and raw text.
function gcd(a,b){return b?gcd(b,a%b):Math.abs(a)}
function frac(n,d){if(!d)return null;const g=gcd(n,d)||1;return {n:n/g,d:d/g}}
function eq(a,b){return a.n*b.d===b.n*a.d}
function fmt(f){if(f.d===1)return String(f.n);const w=Math.floor(f.n/f.d),r=f.n%f.d;return w?`${w} ${r}/${f.d}`:`${r}/${f.d}`}
function parse(s){const t=String(s).replace(/[^\d\/\s]/g,' ').trim().replace(/\s+/g,' ');let m=t.match(/^(?:(\d+) )?(\d+) ?\/ ?(\d+)$/);if(m)return frac(+(m[1]||0)*+m[3]+ +m[2],+m[3]);m=t.match(/^(\d+)$/);return m?{n:+m[1],d:1}:null}
function fractionsIn(text){return [...String(text).matchAll(/(?:(\d+)\s+)?(\d+)\s*\/\s*(\d+)/g)].map(m=>({w:+(m[1]||0),n:+m[2],d:+m[3],raw:m[0].trim()})).filter(f=>f.d>0)}
function value(f){return frac(f.w*f.d+f.n,f.d)}
function operation(text){if(/\d\s*\+\s*\d/.test(text))return 'add';if(/\d\s*[−-]\s*\d/.test(text))return 'subtract';if(/\b(how much (more|longer|farther|further)|left|remain|remaining|difference|fewer|less than)\b/i.test(text))return 'subtract';if(/\b(total|altogether|in all|combine[sd]?|sum|together|plus)\b/i.test(text))return 'add';return null}

// Works out the answer when the stem has exactly two fractions and a clear operation.
function key(item){const fr=fractionsIn(item.stem),op=operation(item.stem);if(fr.length!==2||!op)return null;const [x,y]=fr.map(value);let v=op==='add'?frac(x.n*y.d+y.n*x.d,x.d*y.d):frac(x.n*y.d-y.n*x.d,x.d*y.d);if(v.n<0)v={n:-v.n,d:v.d};return {fr,op,value:v,expr:`${fr[0].raw} ${op==='add'?'+':'−'} ${fr[1].raw}`}}

// Answers students reach through common fraction misconceptions, in priority order.
function misconceptions(k){if(!k)return [];const [p,q]=k.fr,add=k.op==='add',L=p.d*q.d/gcd(p.d,q.d),list=[];
if(!p.w&&!q.w){
if(add)list.push([frac(p.n+q.n,p.d+q.d),'Adds numerators and adds denominators']);
else if(p.d!==q.d)list.push([frac(Math.abs(p.n-q.n),Math.abs(p.d-q.d)),'Subtracts numerators and subtracts denominators']);
list.push([frac(add?p.n+q.n:Math.abs(p.n-q.n),L),'Uses a common denominator without rewriting the numerators']);
if(add&&L!==p.d*q.d)list.push([frac(p.n+q.n,p.d*q.d),'Adds numerators and multiplies denominators'])}
else if(!add&&p.n/p.d<q.n/q.d){const diff=frac(q.n*p.d-p.n*q.d,p.d*q.d);list.push([frac((p.w-q.w)*diff.d+diff.n,diff.d),'Subtracts the smaller fraction from the larger instead of regrouping'])}
k.fr.forEach(f=>list.push([value(f),'Uses only one of the quantities']));
return list.filter(([v])=>v)}
function misconceptionFor(item,i){const v=parse(item.choices[i]),hit=v&&misconceptions(key(item)).find(([m])=>eq(m,v));return hit?hit[1]:null}

function syllables(w){w=w.toLowerCase().replace(/[^a-z]/g,'');if(w.length<=3)return 1;w=w.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/,'').replace(/^y/,'');const m=w.match(/[aeiouy]{1,2}/g);return m?m.length:1}
// Flesch-Kincaid grade level. Fractions count as one short word.
function readability(text){const clean=String(text).replace(/(\d+\s+)?\d+\s*\/\s*\d+/g,'six');const words=clean.match(/[A-Za-z0-9']+/g)||[];if(!words.length)return null;const sentences=Math.max(1,(clean.match(/[.!?]+(\s|$)/g)||[]).length),syl=words.reduce((s,w)=>s+syllables(w),0);return {words:words.length,grade:Math.max(0,.39*words.length/sentences+11.8*syl/words.length-15.59)}}
function isWordProblem(item){return units.test(item.stem)}
function estimateDok(item){const s=item.stem.toLowerCase();if(/\b(explain|justify|why|prove|compare|critique|error|reasonable)\b/.test(s))return 3;if(isWordProblem(item)||/\b(solve|model|represent|estimate)\b/.test(s))return 2;return 1}
function estimateMinutes(item){const r=readability(item.stem);return (item.type==='mc'?1:item.dok>=3?4:2.5)+(r?r.words/120:0)}

// Each check is {status, label, detail} and may name a one-click `fix` the editor can apply.
function analyze(item,{grade=5}={}){const checks=[],add=(status,label,detail,fix)=>checks.push({status,label,detail,fix}),stem=item.stem.trim();
if(!stem)return {checks:[{status:'info',label:'Start writing your item',detail:'The analysis updates as you type.'}],read:null,dok:null,key:null,keyStatus:'unchecked'};
const read=readability(stem),dok=estimateDok(item),k=key(item),fr=fractionsIn(stem);
// Grade-level formulas overreact to one long word in a very short question, so short questions pass.
if(read.words<10)add('pass',`Reading level fits Grade ${grade}`,'Short, direct question.');
else if(read.grade<grade+1)add('pass',`Reading level fits Grade ${grade}`,`${read.grade<1?'Below Grade 1':`About Grade ${read.grade.toFixed(1)}`}. Students can focus on the math, not the wording.`);
else add('warn',`Reading level is above Grade ${grade}`,`About Grade ${read.grade.toFixed(1)}. Dense wording can measure reading instead of math. Shorten sentences or add Language support.`,simplify(stem)!==stem?'simplify':null);
if(read.words>40)add('warn','Question is long',`${read.words} words. Aim for 40 or fewer so the task stays in focus.`);
if(/\b(not|except|least)\b/i.test(stem))add('warn','Negative wording','Words like NOT or EXCEPT are easy to miss. Rephrase positively, or capitalize and bold the word.');
if(!/\?\s*$/.test(stem)&&!/\b(find|solve|explain|show|write|complete|compare|choose|select|describe)\b/i.test(stem))add('warn','Task is unclear','End with a question or a clear direction such as Find, Solve, or Explain.');
const sens=stem.match(sensitive);
if(sens)add('warn','Bias and sensitivity',`"${sens[0]}" may be unfamiliar or uncomfortable for some students. Consider a more neutral context.`);
else add('pass','Bias and sensitivity','No culturally narrow or sensitive contexts found.');
if(visualRef.test(stem))add('warn','Accessibility: missing visual','The question refers to a picture or diagram that isn’t included. Add it with alt text, or remove the reference.');
else if(colorRef.test(stem))add('warn','Accessibility: relies on color','Students with color-vision differences may miss color-only cues. Add a label or pattern.');
else add('pass','Accessibility','No missing visuals or color-only cues.');
if(item.standard.startsWith('5.NF')){const unlike=new Set(fr.map(f=>f.d)).size>1;
if(fr.length<2)add('warn',`Alignment to ${item.standard}`,'This standard is about adding and subtracting fractions, but the question has fewer than two fractions.');
else if(!unlike)add('warn',`Alignment to ${item.standard}`,'The denominators match. This standard calls for unlike denominators.');
else if(item.standard==='5.NF.A.2'&&!isWordProblem(item))add('warn',`Alignment to ${item.standard}`,'No real-world context found. 5.NF.A.2 calls for word problems.');
else add('pass',`Aligned to ${item.standard}`,item.standard==='5.NF.A.2'?'Word problem with unlike denominators.':'Fractions with unlike denominators.')}
else add('info',`Alignment to ${item.standard}`,'Automatic alignment checks cover the Grade 5 fraction standards in this prototype.');
if(Array.isArray(item.components))add(item.components.length?'pass':'warn','Learning components',item.components.length?`Measures: ${item.components.join('; ')}.`:'Tag the skill this question measures so results point to the exact gap.');
const dokNames={1:'recall',2:'applying a skill or concept',3:'strategic thinking'};
if(dok===+item.dok)add('pass',`DOK ${dok} matches your target`,`The wording asks for ${dokNames[dok]}.`);
else add('warn',`Wording reads as DOK ${dok}; target is DOK ${item.dok}`,+item.dok>dok?'To raise demand, ask students to explain, justify, or compare strategies.':'The wording asks for more than your target. Simplify the task or raise the target.');
if(item.type==='mc'){const filled=item.choices.map(c=>c.trim()),values=filled.map(parse),complete=filled.every(c=>c);
if(!complete)add('warn','Fill in all answer options',`${filled.filter(c=>c).length} of 4 options written.`);
else if(new Set(filled.map(c=>c.toLowerCase())).size<4)add('warn','Duplicate answer options','Two options are identical.');
if(k){const matches=values.map((v,i)=>v&&eq(v,k.value)?i:-1).filter(i=>i>=0),markedOk=matches.includes(item.correct);
if(markedOk&&matches.length===1)add('pass','Answer key verified',`${k.expr} = ${fmt(k.value)}, which is option ${letters[item.correct]}.`);
else if(markedOk)add('warn','Two correct answers',`Options ${matches.map(i=>letters[i]).join(' and ')} both equal ${fmt(k.value)}.`);
else if(matches.length)add('warn','Answer key may be wrong',`${k.expr} = ${fmt(k.value)}, which is option ${letters[matches[0]]}, not ${letters[item.correct]}.`);
else if(complete)add('warn','No choice matches the answer',`${k.expr} = ${fmt(k.value)}. Add it as an option or check the question.`)}
const lens=filled.map(c=>c.length),avg=lens.filter((_,i)=>i!==item.correct).reduce((a,b)=>a+b,0)/3;
if(complete&&lens[item.correct]>avg*1.5&&lens[item.correct]-avg>8)add('warn','Correct answer stands out','It is much longer than the other options, so students may pick it without solving.');
if(filled.some(c=>/\b(all|none) of the above\b/i.test(c)))add('warn','"All or none of the above"','These reward test-taking strategy. Use a plausible wrong answer instead.');
if(filled.some(c=>/\b(always|never)\b/i.test(c)))add('warn','Absolute words in options','"Always" and "never" signal a wrong answer.');
const explained=[0,1,2,3].filter(i=>i!==item.correct&&item.rationales[i].trim()).length;
add(explained===3?'pass':'warn',`${explained} of 3 wrong answers name a misconception`,explained===3?'Results will show what students misunderstand, not just who missed it.':'Name the misconception behind each wrong answer so results point to next steps.');
// A wrong answer is believable when it is a number near the answer or comes from a known misconception.
if(k&&complete){const target=k.value.n/k.value.d,weak=[0,1,2,3].filter(i=>{if(i===item.correct)return false;const v=values[i];if(!v)return true;return !item.rationales[i].trim()&&!misconceptionFor(item,i)&&(v.n===0||v.n/v.d>target*3)});
add(weak.length?'warn':'pass','Wrong answers are believable',weak.length?`Option ${weak.map(i=>letters[i]).join(' and ')} ${weak.length===1?'is':'are'} easy to rule out without solving. Use an answer a student would reach through a common mistake.`:'Each wrong answer is close to the answer or comes from a common mistake.')}
if(values.every(v=>v)&&!values.every((v,i)=>!i||v.n/v.d>=values[i-1].n/values[i-1].d))add('info','Order numeric options','List numbers from least to greatest so position does not hint at the answer.','order')}
else if(k){const has=item.exemplar.includes(fmt(k.value));add(has?'pass':'warn','Scoring notes',`${k.expr} = ${fmt(k.value)}.${has?' Your exemplar includes the answer.':' Add the answer and a strong explanation to your exemplar.'}`)}
else add(item.exemplar.trim()?'pass':'warn','Scoring notes',item.exemplar.trim()?'Exemplar response added.':'Add an exemplar response so scoring is consistent.');
const keyStatus=checks.some(c=>keyIssues.includes(c.label))?'issue':checks.some(c=>c.label==='Answer key verified')?'verified':'unchecked';
return {checks,read,dok,key:k,keyStatus}}

// Learner-support content built from the item. Teachers can edit all of it.
function simplify(text){let t=text;plainWords.forEach(([re,w])=>t=t.replace(re,w));return t.replace(/,\s*and\s+/g,'. ').replace(/\.\s+([a-z])/g,(m,c)=>'. '+c.toUpperCase()).replace(/\s+/g,' ').trim()}

SUPPORTS.language.desc=ela?'Plainer question wording and word help for the passage and question. The reading skill stays the same.':'Plainer wording and word help for multilingual learners and students who find dense text hard. The math stays the same.';
SUPPORTS.audio.desc=ela?'Students can listen to the passage, the question and the answer options.':'Students can listen to the question and answer options.'}
function visualModel(it,editable){return ELA.isELA(it)?ELA.organizer(it,editable):IA.fractionBars(it.stem)}
function glossaryFor(it,text){return ELA.isELA(it)?ELA.glossary(text,it):IA.glossary(text)}
function stateSource(){return isELASubject()?ELA.stateSource:KG.stateSource}

// Routing
const ROUTES={overview:pageOverview,assessments:pageAssessments,bank:pageBank,setup:pageSetup,questions:pageQuestions,review:pageReview,details:pageDetails,assign:pageAssign,confirm:pageConfirm,student:pageStudent,results:pageResults,scheduled:pageScheduled};
const TITLES={overview:'Overview',assessments:'Assessments',bank:'Item Bank',setup:'Create · Setup',questions:'Create · Items',review:'Create · Review',details:'Create · Details',assign:'Assign · Audience & delivery',confirm:'Assign · Confirm',scheduled:'Assign · Scheduled',student:'Student preview',results:'Results'};
function route(){const r=location.hash.slice(1);return ROUTES[r]?r:'overview'}
function go(r){if(location.hash.slice(1)===r)render();else location.hash=r;window.scrollTo(0,0)}
function render(){applySubject();const r=route();document.getElementById('app').innerHTML=ROUTES[r]();document.title='Educator · '+TITLES[r];save()}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});
function toast(msg){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function resetDemo(){try{localStorage.removeItem(STORE)}catch(e){}state=defaultState();toast('Prototype reset.');go('overview')}

// Shared chrome

return `<header class="topbar"><div class="brand"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="8" fill="none" stroke="currentColor" stroke-width="3.2" stroke-dasharray="40 11" transform="rotate(35 11 11)"/><circle cx="17.2" cy="6.4" r="2.3" fill="#FF554D"/></svg>Classroom Assessment<span class="chip option-badge" title="Prototype option">Option ${OPTION.id} · ${esc(OPTION.name)}</span></div>
<nav class="topnav" aria-label="Main">${links.map(([k,l])=>`<button class="${k===active?'active':''}" onclick="${k==='overview'?"go('overview')":k==='assessments'?"go('assessments')":k==='bank'?"go('bank')":k==='results'?"go('results')":`toast('${l} is not part of this prototype.')`}">${l}</button>`).join('')}</nav><div class="top-right"><svg class="apps" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="1" y="1" width="6.5" height="6.5" rx="1.5"/><rect x="10.5" y="1" width="6.5" height="6.5" rx="1.5"/><rect x="1" y="10.5" width="6.5" height="6.5" rx="1.5"/><rect x="10.5" y="10.5" width="6.5" height="6.5" rx="1.5"/></svg><div class="avatar" aria-label="Sara L.">SL</div></div></header>`}
function draftChip(){return `<span class="chip">${state.assigned?'Assigned':'Draft'}</span>`}
// The CAP flow: Create (setup, items, review, details) → Assign (audience, supports, sessions) → Review (confirm and assign).
const STEPS=['Create','Assign','Review'];
function stepper(step){return `<ol class="stepper" aria-label="Assessment progress">${STEPS.map((s,i)=>(i?`<li class="line ${i<=step?'done':''}" aria-hidden="true"></li>`:'')+`<li class="${i<step?'done':i===step?'current':''}" ${i===step?'aria-current="step"':''}><span class="dot">${i<step?'✓':i+1}</span>${s}</li>`).join('')}</ol>`}
function pageHead(step,title,lede){return `<div class="backrow"><button class="btn-link back" onclick="go('overview')">← ${esc(state.title)}</button> ${draftChip()}</div><div class="page-head"><div><h1>${title}</h1>${lede?`<p class="lede">${lede}</p>`:''}</div>${stepper(step)}</div>`}
function totals(){const passages=[...new Set(state.items.map(it=>it.passage).filter(Boolean))],reading=passages.reduce((m,id)=>m+ELA.passageStats(ELA.resolve(id)).words/150,0);
return {n:state.items.length,marks:state.items.reduce((s,it)=>s+ +it.marks,0),minutes:Math.max(1,Math.round(reading+state.items.reduce((s,it)=>s+IA.estimateMinutes(it),0)))}}
function bottomBar(label,next,back,action){const t=totals();
return `<div class="bottombar"><div class="bb-info"><span class="bb-icon" aria-hidden="true">▤</span><div><strong>${esc(state.title)}</strong> ${draftChip()}<div class="small muted">Grade ${esc(state.grade)} · ${esc(state.subject)} · ${plural(t.n,'item')} · ${plural(t.marks,'point')}</div></div></div>
<div class="bb-actions"><button class="btn" onclick="toast('Assessment draft saved in this browser.')">Save assessment draft</button>${back?`<button class="btn" onclick="go('${back}')">Back</button>`:''}<button class="btn primary" onclick="${action||`go('${next}')`}">${label} →</button></div></div>`}
function statusChip(it){const warns=IA.analyze(it,{grade:+state.grade}).checks.filter(c=>c.status==='warn').length;return warns?`<span class="chip warning">${plural(warns,'suggestion')}</span>`:'<span class="chip success">✓ Ready</span>'}
function typeLabel(it){return it.type==='mc'?'Multiple choice':'Constructed response'}

// Overview and setup
// Dates for the overview calendar and session defaults, relative to today so the demo never looks stale.
function isoDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function weekDays(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7);return [...Array(7)].map((_,i)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+i))}
const dayName=d=>d.toLocaleDateString('en-US',{weekday:'short'}),monthDay=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
function clock(hhmm){if(!hhmm)return '';const [h,m]=hhmm.split(':').map(Number);return `${h%12||12}:${String(m).padStart(2,'0')} ${h<12?'AM':'PM'}`}
// A rough share of the Create → Assign → Review steps done, for the overview's draft card.
function draftProgress(){let p=20;if(state.items.length)p+=30;if(state.details.ack)p+=15;if(selectedStudents().length)p+=15;if(state.assign.ack)p+=10;return p}
function priorityCard(icon,eyebrow,title,body,action){return `<section class="card priority"><div class="priority-top"><span class="stat-icon" aria-hidden="true">${icon}</span><div><h2>${eyebrow}</h2><p class="muted small">${esc(title)}</p></div></div><div class="priority-body">${body}</div>${action}</section>`}
// Overview and Assessments share the priorities columns: drafts, assessments that need review, and completed ones.
// Sample sessions and assessments sit beside the one you build, with dates relative to today so the demo never looks stale.
const SAMPLE_SESSIONS=[[-2,'09:00','English 9 — Unit 5 Quiz','Grade 9',20],[0,'09:00','Ratios and proportions','Class 7A',24],[0,'10:30','Ratios and proportions','Class 7B',26],[0,'13:00','Ratios and proportions','Class 7C',24],[1,'10:30','Grade 8 Science Benchmark','Grade 8',28],[6,'09:00','Algebra 1 — Unit 4 Test','Grade 9',22],[9,'13:00','Civics Mid-Unit Assessment','Grade 8',24]];
const dayOffset=n=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+n);return d};
const longDate=d=>d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'}),shortDate=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
function classesOf(names){return Object.keys(ROSTER).filter(cls=>ROSTER[cls].some(st=>names.includes(st.name))).join(', ')}
function sessionsOn(iso){const list=SAMPLE_SESSIONS.map(([o,time,title,cls,n])=>({date:isoDate(dayOffset(o)),time,title,cls,n})).filter(e=>e.date===iso),r=state.results;
if(r&&r.date===iso)list.push({date:iso,time:state.assign.session.start,title:r.title,cls:classesOf(r.students),n:r.students.length,mine:true});return list.sort((a,b)=>a.time.localeCompare(b.time))}
function openDraft(){go(state.items.length?'review':'questions')}
function pItem(title,meta,body,action,tone){return `<div class="pitem ${tone}"><div class="pitem-head"><strong>${esc(title)}</strong><small>${meta}</small></div>${body?`<div class="pitem-body">${body}</div>`:''}${action}</div>`}
function priorityColumns(){const r=state.results,mine=!state.assigned,cls=r?classesOf(r.students):'';
const drafts=[...(mine?[pItem(state.title,plural(state.items.length,'item'),`<div class="row small"><span>${draftProgress()}% complete</span></div><div class="meter"><div style="width:${draftProgress()}%"></div></div>`,`<button class="btn primary sm" onclick="openDraft()">Continue draft</button>`,'amber')]:[]),
 pItem('Equivalent fractions','4 items','<div class="row small"><span>60% complete</span></div><div class="meter"><div style="width:60%"></div></div>',`<button class="btn primary sm" onclick="toast('Sample draft. Create an assessment to start your own.')">Continue draft</button>`,'amber')];
const review=r?[pItem(r.title,esc(cls),r.responses?`<span class="small muted">${plural(r.students.length,'response')} · constructed responses to score</span>`:'<span class="small muted">Waiting for students to hand in</span>',`<button class="btn primary sm" onclick="go('results')">${r.responses?'Open scoring':'Open results'}</button>`,'red')]
 :[pItem('Fractions check','Class 7B','<span class="small muted">6 responses · 4 missing</span> <span class="chip danger">Needs review</span>',`<button class="btn primary sm" onclick="toast('Sample assessment. Assign yours to score it here.')">Open scoring</button>`,'red')];
const done=[pItem('Fractions check','Class 7A · 24 scored','',`<button class="btn primary sm" onclick="toast('Sample results. Assign your assessment to see its results.')">View results</button>`,'green'),pItem('Fractions check','Class 7C · 24 scored','',`<button class="btn primary sm" onclick="toast('Sample results. Assign your assessment to see its results.')">View results</button>`,'green')];
const col=(k,label,list)=>`<section class="pcol ${k}"><div class="pcol-tab">${label} <span class="count">${list.length}</span></div><div class="pcol-body">${list.join('')}</div></section>`;
return `<div class="pcols">${col('drafts','Drafts',drafts)}${col('review','Needs review',review)}${col('done','Completed',done)}</div>`}
function setOverviewDay(iso){state.ovDay=iso;render()}
function shiftMonth(n){state.ovMonth=(state.ovMonth||0)+n;render()}
function calendar(){const now=new Date(),first=new Date(now.getFullYear(),now.getMonth()+(state.ovMonth||0),1),days=new Date(first.getFullYear(),first.getMonth()+1,0).getDate(),lead=(first.getDay()+6)%7,today=isoDate(now),sel=state.ovDay||today;
const cells=[...Array(lead)].map(()=>'<div class="cal-cell empty"></div>').concat([...Array(days)].map((_,i)=>{const d=new Date(first.getFullYear(),first.getMonth(),i+1),iso=isoDate(d),ev=sessionsOn(iso);
return `<button class="cal-cell ${iso===sel?'sel':''} ${iso===today?'today':''}" aria-pressed="${iso===sel}" aria-label="${longDate(d)}, ${plural(ev.length,'session')}" onclick="setOverviewDay('${iso}')"><span class="cal-num">${i+1}</span>${ev.slice(0,3).map(e=>`<span class="cal-ev ${e.mine?'mine':''}">${e.time} ${esc(e.cls.replace(/^Class /,'').replace(/^Grade /,'G'))}</span>`).join('')}</button>`}));
return `<section class="card cal"><div class="row"><h2>${first.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</h2><div class="row-actions"><button class="icon-btn" aria-label="Previous month" onclick="shiftMonth(-1)">‹</button><button class="icon-btn" aria-label="Next month" onclick="shiftMonth(1)">›</button></div></div>
<div class="cal-grid">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells.join('')}</div></section>`}
function dayPanel(){const iso=state.ovDay||isoDate(new Date()),ev=sessionsOn(iso),r=state.results;
const snap=r?{title:r.title,n:r.students.length,scored:r.responses?r.students.length:0,pending:r.responses?0:r.students.length,missing:0,go:"go('results')"}:{title:'Fractions check',n:74,scored:64,pending:6,missing:4,go:"toast('Sample results. Assign your assessment to see its results.')"};
const pct=x=>snap.n?x/snap.n*100:0;
return `<section class="card day"><h2>${longDate(new Date(iso+'T00:00'))}</h2><p class="muted small">${plural(ev.length,'scheduled session')}</p>
${ev.map(e=>`<div class="day-ev ${e.mine?'mine':''}"><span class="day-time">${e.time}</span><div><strong>${esc(e.title)}</strong><small>${esc(e.cls)} · ${plural(e.n,'student')}</small></div><button class="btn sm" onclick="${e.mine?"go('results')":"toast('Sample session. It is not part of this prototype.')"}">View session →</button></div>`).join('')||'<p class="hint">No sessions on this day.</p>'}
<div class="snapshot"><div class="row"><div><h3>Results snapshot</h3><small class="muted">${esc(snap.title)} · ${plural(snap.n,'student')}</small></div><button class="btn-link" onclick="${snap.go}">View results →</button></div>
<div class="snap-tiles"><div><strong>${snap.scored}</strong> scored</div><div class="pending"><strong>${snap.pending}</strong> pending</div><div class="missing"><strong>${snap.missing}</strong> missing</div></div>
<div class="snap-bar" role="img" aria-label="${snap.scored} of ${snap.n} scored"><span style="width:${pct(snap.scored)}%">${snap.scored?`${snap.scored} of ${snap.n} (${Math.round(pct(snap.scored)*10)/10}%)`:''}</span><span class="pending" style="width:${pct(snap.pending)}%">${snap.pending||''}</span><span class="missing" style="width:${pct(snap.missing)}%">${snap.missing||''}</span></div></div></section>`}
function pageOverview(){return topbar('overview')+`<main class="page"><div class="page-head"><h1>Today’s priorities</h1><button class="btn" onclick="createAnother()">+ Create assessment</button></div>
${priorityColumns()}<div class="grid-2 even ov-grid">${calendar()}${dayPanel()}</div>
<p class="small muted">Concept prototype · Sample content and fictional students · Saved in this browser only · <button class="btn-link" onclick="resetDemo()">Reset prototype</button></p></main>`}

// Assessments: start a new one, see priorities, and find any assessment in your list.
const SAMPLE_ASSESSMENTS=[['Algebra basics','8','Mathematics','Draft',6],['Properties of shapes','4','Mathematics','Draft',6],['Reading comprehension','6','English Language Arts','Draft',6],['Fractions check','5','Mathematics','In progress',15],['Reading comprehension','6','English Language Arts','Completed',21]];
const BANKED_ASSESSMENTS=[['Fractions check (banked)','5','Mathematics','Banked',30],['Main idea and details','5','English Language Arts','Banked',40]];
function myStatus(){const r=state.results;return !state.assigned?'Draft':r&&r.responses?'Completed':'Scheduled'}
function assessmentRows(){const tab=state.asTab||'mine',q=(state.asQ||'').toLowerCase(),f=state.asFilter||'All';
const rows=tab==='mine'?[{title:state.title,grade:state.grade,subject:state.subject,status:myStatus(),days:0,mine:true},...SAMPLE_ASSESSMENTS.map(([title,grade,subject,status,days])=>({title,grade,subject,status,days}))]:BANKED_ASSESSMENTS.map(([title,grade,subject,status,days])=>({title,grade,subject,status,days}));
return rows.filter(r=>(!q||r.title.toLowerCase().includes(q))&&(f==='All'||(f==='Scheduled'?['Scheduled','In progress'].includes(r.status):r.status===f)))}
function openAssessment(mine){if(!mine)return toast('Sample assessment. Open your own assessment from the top of the list.');state.assigned?go('results'):openDraft()}
function setAsQuery(v){state.asQ=v;const el=document.getElementById('as-rows');if(el)el.innerHTML=assessmentTable()}
function assessmentTable(){const rows=assessmentRows(),tone={Draft:'warning','In progress':'info',Scheduled:'info',Completed:'success',Banked:''};
return rows.map(r=>`<tr class="${r.mine?'mine':''}"><td><button class="btn-link row-title" onclick="openAssessment(${!!r.mine})">▤ ${esc(r.title)}</button>${r.mine?' <span class="chip info">Yours</span>':''}</td><td>Grade ${esc(r.grade)} · ${esc(r.subject==='English Language Arts'?'English':r.subject)}</td><td>Assessment</td><td><span class="chip ${tone[r.status]}">${r.status}</span></td><td>${shortDate(dayOffset(-r.days))}</td><td><button class="icon-btn" aria-label="Actions for ${esc(r.title)}" onclick="openAssessment(${!!r.mine})">⋯</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">No assessments match.</td></tr>'}
function pageAssessments(){const tab=state.asTab||'mine',f=state.asFilter||'All';
return topbar('assessments')+`<main class="page"><div class="page-head as-head"><h1><span class="title-icon" aria-hidden="true">▢</span>Assessments</h1><div class="entry-tiles"><button class="entry-tile" onclick="createAnother()"><span aria-hidden="true">✎</span><strong>Create new assessment<br>from scratch</strong><span aria-hidden="true">→</span></button><button class="entry-tile" onclick="toast('The assessment library is not part of this prototype. Use the Item Bank to find items.')"><span aria-hidden="true">▥</span><strong>Use assessment<br>library</strong><span aria-hidden="true">→</span></button></div></div>
${priorityColumns()}
<section class="card"><div class="as-tools"><div class="seg underline" role="tablist">${[['mine','My assessments'],['banked','Banked assessments']].map(([k,l])=>`<button role="tab" class="${tab===k?'on':''}" aria-selected="${tab===k}" onclick="state.asTab='${k}';render()">${l}</button>`).join('')}</div>
<input type="search" class="pill-search" aria-label="Search assessments" placeholder="Search assessments" value="${esc(state.asQ||'')}" oninput="setAsQuery(this.value)">
<div class="pills">${['All','Drafts','Scheduled','Completed'].map(p=>`<button class="pill ${f===(p==='Drafts'?'Draft':p)?'on':''}" onclick="state.asFilter='${p==='Drafts'?'Draft':p}';render()">${p}</button>`).join('')}</div></div>
<table class="table as-table"><thead><tr><th>Title</th><th>Class</th><th>Type</th><th>Status</th><th>Last updated</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody id="as-rows">${assessmentTable()}</tbody></table></section></main>`}

// Item Bank: browse Cognia's items in a list with a detail panel, or expand to a sortable table.
function ibState(){return state.ib||(state.ib={sel:BANK[0].id,table:false,q:'',search:false,filters:false,f:{grade:[],subject:[],type:[]},sort:{k:'',dir:1},hidden:[],confirm:null})}
function hashOf(id){return [...id].reduce((h,c)=>(h*31+c.charCodeAt(0))%997,7)}
function bankMeta(b){const h=hashOf(b.id),s=KG.get(b.standard);return {grade:s.grade,subject:ELA.isELA(b)?'English Language Arts':'Mathematics',type:typeLabel(b),success:38+h%52,status:h%7===0?'Draft':'Active',edited:dayOffset(-(3+h%60))}}
const subjShort=s=>s==='English Language Arts'?'ELA':'Mathematics';
function bankRows(){const ib=ibState(),q=ib.q.toLowerCase();let rows=BANK.filter(b=>!ib.hidden.includes(b.id)).map(b=>({b,m:bankMeta(b)})).filter(({b,m})=>(!q||(b.stem+' '+b.standard+' '+stdCode(b.standard)).toLowerCase().includes(q))&&(!ib.f.grade.length||ib.f.grade.includes(String(m.grade)))&&(!ib.f.subject.length||ib.f.subject.includes(m.subject))&&(!ib.f.type.length||ib.f.type.includes(m.type)));
const k=ib.sort.k,val={item:r=>r.b.stem,type:r=>r.m.type,standard:r=>stdCode(r.b.standard),status:r=>r.m.status,edited:r=>+r.m.edited,success:r=>r.m.success}[k];
if(val)rows.sort((x,y)=>(val(x)>val(y)?1:val(x)<val(y)?-1:0)*ib.sort.dir);return rows}
function ibSet(k,v){ibState()[k]=v;render()}
function ibSearch(v){ibState().q=v;const el=document.getElementById('ib-results');if(el){el.innerHTML=ibResults();document.getElementById('ib-count').textContent=plural(bankRows().length,'item')}}
function ibToggleFilter(group,value){const a=ibState().f[group],i=a.indexOf(value);i<0?a.push(value):a.splice(i,1);render()}
function ibClearFilters(){ibState().f={grade:[],subject:[],type:[]};render()}
function ibSort(k){const s=ibState().sort;s.dir=s.k===k?-s.dir:1;s.k=k;render()}
function ibSelect(id){const ib=ibState();ib.sel=id;ib.table=false;ib.confirm=null;render()}

function ibFilterMenu(group,label,choices){const on=ibState().f[group];return `<details class="ib-menu"><summary>${label}${on.length?` (${on.length})`:''}</summary><div class="ib-menu-list">${choices.map(c=>`<label class="check"><input type="checkbox" ${on.includes(String(c))?'checked':''} onchange="ibToggleFilter('${group}','${c}')"> ${group==='grade'?'Grade '+c:esc(c)}</label>`).join('')}</div></details>`}
function ibToolbar(){const ib=ibState(),f=ib.f,chips=[...f.grade.map(v=>['grade',v,'Grade '+v]),...f.subject.map(v=>['subject',v,v]),...f.type.map(v=>['type',v,v])];
return `<div class="ib-bar"><button class="btn primary" onclick="state.mode='manual';go('questions')">+ Create item</button><div class="ib-icons"><button class="icon-btn ${ib.search?'on':''}" aria-label="Search items" aria-pressed="${ib.search}" data-tip="Search" onclick="ibSet('search',!ibState().search)">⌕</button><button class="icon-btn ${ib.filters?'on':''}" aria-label="Filter items" aria-pressed="${ib.filters}" data-tip="Filter" onclick="ibSet('filters',!ibState().filters)">⏷</button><button class="icon-btn" aria-label="${ib.table?'Collapse to list':'Expand to table'}" data-tip="${ib.table?'Collapse':'Expand'}" onclick="ibSet('table',!ibState().table)">${ib.table?'⇤':'⇥'}</button></div></div>
${ib.search||ib.filters?`<div class="ib-filters">${ib.search?`<input type="search" class="pill-search" aria-label="Search items" placeholder="Search by item text or standard" value="${esc(ib.q)}" oninput="ibSearch(this.value)">`:''}${ib.filters?ibFilterMenu('grade','Grade',[...new Set(BANK.map(b=>KG.get(b.standard).grade))].sort((a,b)=>a-b))+ibFilterMenu('subject','Subject',['Mathematics','English Language Arts'])+ibFilterMenu('type','Item type',['Multiple choice','Constructed response']):''}</div>`:''}
${chips.length?`<div class="ib-chips">${chips.map(([g,v,l])=>`<button class="chip removable" onclick="ibToggleFilter('${g}','${v}')">${esc(l)} <span aria-hidden="true">×</span><span class="sr-only">Remove filter</span></button>`).join('')}<button class="btn-link" onclick="ibClearFilters()">Clear all</button></div>`:''}
<p class="ib-count muted small" id="ib-count">${plural(bankRows().length,'item')}</p>`}

function ibDetail(){const ib=ibState(),b=BANK.find(x=>x.id===ib.sel&&!ib.hidden.includes(x.id));if(!b)return '<section class="card ib-detail"><p class="hint">Choose an item to see its details.</p></section>';

const wrong=b.type==='mc'?b.choices.map((c,i)=>i!==b.correct&&b.rationales[i]?`<li>Students who choose <strong>${'ABCD'[i]} (${esc(c)})</strong> often: ${esc(b.rationales[i])}.</li>`:'').join(''):'';

<div class="row-actions"><button class="btn ghost" onclick="toast('Editing bank items is not part of this prototype.')">✎ Edit</button>${added?'<button class="btn success-btn" disabled>✓ Added</button>':`<button class="btn" onclick="ibAdd('${b.id}')">Add to assessment</button>`}</div></div>
<div class="ib-item"><div class="row small"><span><strong>Item</strong><br><span class="muted">${typeLabel(b)}</span></span><span class="muted">Last edited ${m.edited.toLocaleDateString('en-US')}</span></div>${passageNote(b)}
<p class="ib-stem">${esc(b.stem)}</p>${b.type==='mc'?`<ol class="ib-choices">${b.choices.map((c,i)=>`<li class="${i===b.correct?'correct':''}"><span class="letter">${'ABCD'[i]}</span>${esc(c)}${i===b.correct?'<span class="sr-only">Correct answer</span><span aria-hidden="true" class="ok">✓</span>':''}</li>`).join('')}</ol>`:`<div class="ib-exemplar"><small class="muted">Exemplar response</small><p>${esc(b.exemplar||'')}</p></div>`}</div>
<h3 class="sub">Analysis</h3><div class="ib-analysis">
<details><summary><span class="a-icon" aria-hidden="true">☰</span>Requirements</summary><p>Standard ${stdCode(b.standard)}${alabama()?` (national ${b.standard})`:''} · Depth of knowledge ${b.dok} · ${plural(b.marks,'point')}. ${esc(stdLabel(b.standard))}.</p><ul class="bullets">${(b.components||[]).map(c=>`<li>${esc(c)}</li>`).join('')}</ul></details>
<details><summary><span class="a-icon" aria-hidden="true">◐</span>Psychological reasoning</summary>${wrong?`<ul class="bullets">${wrong}</ul>`:`<p>${b.rubric?esc(b.rubric):'Look for a complete answer that uses evidence and explains the reasoning.'}</p>`}</details>

<details><summary><span class="a-icon" aria-hidden="true">✦</span>Item analysis</summary><ul class="checks">${a.checks.map(c=>checkLine(c.status==='pass',esc(c.label),esc(c.detail||''))).join('')}</ul></details></div>
