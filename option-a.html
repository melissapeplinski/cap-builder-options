${ib.confirm===b.id?`<div class="notice danger-notice"><strong>Delete this item?</strong> It will be removed from the Item Bank. Assessments that already use it keep their copy.<div class="row-actions"><button class="btn" onclick="ibSet('confirm',null)">Cancel</button><button class="btn danger" onclick="ibDelete('${b.id}')">Delete item</button></div></div>`:`<button class="btn ghost danger-ghost" onclick="ibSet('confirm','${b.id}')">🗑 Delete item</button>`}</section>`}
function pageBank(){const ib=ibState();
return topbar('bank')+`<main class="page"><h1 class="sr-only">Item Bank</h1><div class="ib ${ib.table?'expanded':''}"><section class="ib-list">${ibToolbar()}<div id="ib-results" class="${ib.table?'':'ib-scroll'}">${ibResults()}</div></section>${ib.table?'':ibDetail()}</div></main>`}
// Alabama state standards pathway (a custom contract). When it's on, Alabama Course of Study codes and wording lead
// everywhere and the national code becomes the crosswalk. state.contract is a demo switch for the locked state.
const AL_PATHWAY='State standards — custom contract';
function alabama(){return state.pathway===AL_PATHWAY&&state.contract!==false}
function stdCode(code){const s=KG.get(code);return alabama()&&s.state?s.state:code}
function stdLabel(code){const s=KG.get(code);return alabama()&&s.stateLabel?s.stateLabel:s.label}
function stdText(code){const s=KG.get(code);return alabama()&&s.stateText?s.stateText:s.text}
function stdName(code){return `${stdCode(code)} · ${stdLabel(code)}`}
function setContract(on){state.contract=on;if(!on&&state.pathway===AL_PATHWAY)state.pathway=PATHWAYS[0];render()}
// On the Alabama pathway, the item analysis's alignment check names the Alabama standard and its national crosswalk.
const baseAnalyze=IA.analyze;
IA.analyze=(it,o)=>{const a=baseAnalyze(it,o),s=KG.get(it.standard);if(!alabama()||!it.stem.trim())return a;
if(!s.state)a.checks.push({status:'warn',label:'No Alabama alignment',detail:`${it.standard} has no ${stateSource()} match yet. Choose another standard or ask your content team.`});
else a.checks.forEach(c=>{if(c.label.includes(it.standard)){c.label=c.label.replace(it.standard,s.state);c.detail=c.detail.replaceAll(it.standard,s.state)+` Crosswalked from national ${it.standard}.`}});return a};
function setSetup(field,value){if(field==='subject'){switchSubject(value);return render()}state[field]=value;if(field==='standard'){state.bankFilter.standard=value;if(!state.draft.stem.trim())state.draft.standard=value}render()}
function setStdQuery(v){state.stdQuery=v;const el=document.getElementById('std-results');if(el)el.innerHTML=stdResults()}
function stdResults(){const codes=KG.search(state.stdQuery).filter(c=>writable().includes(c));return codes.length?codes.map(c=>`<button class="std-result ${c===state.standard?'on':''}" aria-pressed="${c===state.standard}" onclick="setSetup('standard','${c}')"><strong>${stdCode(c)}</strong><span>${esc(stdLabel(c))}</span><small>Grade ${STANDARDS[c].grade}${alabama()?' · '+c:''}</small></button>`).join(''):'<p class="hint">No standards match. Try a topic, such as “word problems”.</p>'}
function stdChip(code){const s=STANDARDS[code];return `<span class="chip" title="${esc(s?stdText(code):'')}">${s?esc(stdName(code)):code}</span>`}
function standardCard(code){const s=KG.get(code),al=alabama();
return `<div class="eyebrow">Grade ${s.grade} · ${stdCode(code)}</div><div class="row"><h2>${esc(stdLabel(code))}</h2><span class="chip" title="${al?'National standard':'State crosswalk'}">${al?'National '+code:`${KG.state} ${esc(s.state)}`}</span></div><p class="small">${esc(stdText(code))}</p>
<h3 class="sub">Learning components</h3><ul class="bullets">${s.components.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>
<h3 class="sub">Progression</h3><div class="progression"><div><small>Builds on</small>${s.prereqs.map(stdChip).join('')||'<small>None listed</small>'}</div><span aria-hidden="true">→</span><div><small>Leads to</small>${s.next.map(stdChip).join('')||'<small>None listed</small>'}</div></div>
<p class="source">${al?`Standard from the ${stateSource()} (labeled sample for content experts to verify), crosswalked through the ${KG.source}.`:`Source: ${KG.source} (sample data in this prototype). State crosswalk codes are samples.`}</p>`}
const PATHWAYS=['College and career readiness','Ready-to-use classroom assessments',AL_PATHWAY];
// What the Alabama pathway changes, or why it's locked, plus the demo switch for the district's contract.
function pathwayNote(){const locked=state.contract===false;
return `${alabama()?`<div class="banner al-banner"><strong>${KG.state} state standards pathway</strong><div>Standards search, item tags, Cognia item suggestions, coverage and results use the ${stateSource()}. National codes appear as the crosswalk.</div></div>`:''}
${locked?`<details class="why-locked" open><summary>🔒 Why is the state standards pathway locked?</summary><p class="small">Your district doesn’t have the ${KG.state} state standards contract. With it, educators build and report against the ${stateSource()}. Contact your Cognia account manager to add it.</p></details>`:''}
<label class="check demo-switch"><input type="checkbox" ${locked?'':'checked'} onchange="setContract(this.checked)"> <span>Prototype demo: this district has the ${KG.state} standards contract</span></label>`}
function pageSetup(){const d=state.details;return topbar('assessments')+`<main class="page">${pageHead(0,'Set up your assessment','Start with the essentials. You can add more later.')}
<div class="grid-2"><section class="card"><label for="s-title">Assessment title *</label><input id="s-title" value="${esc(state.title)}" onchange="setSetup('title',this.value)">
<label for="s-subject">Subject *</label><select id="s-subject" onchange="setSetup('subject',this.value)">${opt('Mathematics','Mathematics',state.subject)}${opt(ELA.SUBJECT,ELA.SUBJECT,state.subject)}</select>${isELASubject()?'<p class="hint">You’ll pick or write a passage, then write multiple-choice or constructed-response items about it. Your math assessment is saved and comes back if you switch.</p>':''}
<label for="s-grade">Grade level *</label><select id="s-grade" onchange="setSetup('grade',this.value)">${['5','6','8'].map(g=>opt(g,'Grade '+g,state.grade)).join('')}</select>
<label for="s-path">Assessment pathway</label><select id="s-path" onchange="setSetup('pathway',this.value)">${PATHWAYS.map(p=>p===AL_PATHWAY?`<option value="${p}" ${alabama()?'selected':''} ${state.contract===false?'disabled':''}>${KG.state} state standards — custom contract${state.contract===false?' (locked)':''}</option>`:opt(p,p,state.pathway||PATHWAYS[0])).join('')}</select>
${pathwayNote()}
<label for="s-std">${alabama()?KG.state+' standard':'Standard'}</label><p class="hint">We’ll use it to find matching Cognia items and check coverage as you write.</p><input id="s-std" type="search" value="${esc(state.stdQuery)}" oninput="setStdQuery(this.value)" placeholder="${alabama()?'Search by Alabama code (e.g., AL 5.11), topic, or skill':'Search by code, topic, or skill (e.g., word problems)'}" autocomplete="off"><div class="std-results" id="std-results">${stdResults()}</div>
<details class="optional"><summary>Optional settings</summary><div class="field-row">${selectRow('Duration','duration',['None','10 minutes','15 minutes','20 minutes','30 minutes','45 minutes'])}<div><label for="s-desc">Description</label><input id="s-desc" value="${esc(d.description)}" onchange="setDetail('description',this.value)"></div></div></details></section>
<aside><section class="card promo"><div class="eyebrow">Assessment Builder</div><h2>Get it right, faster</h2><p class="muted small">A simple, three-step flow to go from setup to assigned assessment.</p><ol class="promo-steps"><li><strong>Create</strong><small>Add details and items</small></li><li><strong>Assign</strong><small>Students, supports and sessions</small></li><li><strong>Review</strong><small>Check and send</small></li></ol></section><section class="card">${standardCard(state.standard)}</section></aside></div></main>`+bottomBar('Continue','questions','overview')}
// Item editor, shared by Create (draft item) and Review (selected item)
function editing(){return route()==='review'?state.items[state.reviewSel]:state.draft}
function setField(f,v,rerender){const it=editing();it[f]=f==='dok'||f==='marks'?+v:v;if(f==='standard')it.components=KG.suggestComponents(it);save();rerender?render():refresh()}
function toggleComponent(c){const it=editing(),i=it.components.indexOf(c);i<0?it.components.push(c):it.components.splice(i,1);save();refresh()}
function editCopy(){editing().source='copy';toast('Your version is ready to edit. The Cognia original is unchanged.');render()}
function revertCopy(){const it=editing(),orig=BANK.find(b=>b.id===it.bankId);Object.assign(it,clone(orig),{id:it.id,bankId:orig.id,source:'bank'});toast('Reverted to the Cognia original.');render()}
// One-click fixes offered by the item analysis.
function applyFix(kind){const it=editing();
if(kind==='simplify'){it.stem=IA.simplify(it.stem);toast('Simpler wording applied. Check that the math is unchanged.')}
if(kind==='order'){const val=i=>{const v=IA.parse(it.choices[i]);return v.n/v.d},order=[0,1,2,3].sort((a,b)=>val(a)-val(b));it.choices=order.map(i=>it.choices[i]);it.rationales=order.map(i=>it.rationales[i]);it.correct=order.indexOf(it.correct);toast('Options reordered from least to greatest.')}
render()}
function setChoice(i,v){editing().choices[i]=v;save();refresh()}
function setRationale(i,v){editing().rationales[i]=v;save();refresh()}
function setCorrect(i){editing().correct=i;render()}
function setSupport(k,f,v){editing().supports[k][f]=v;save();refresh()}
function toggleSupport(k){const s=editing().supports[k];s.on=!s.on;if(s.on&&'text' in s&&!s.text.trim())regen(k,false);render()}
function regen(k,rerender=true){const it=editing(),s=it.supports[k];if(k==='language'){s.text=IA.simplify(it.stem);s.glossary=glossaryFor(it,s.text)}else s.text=IA.generate(k,it);rerender?render():save()}
function useSuggestion(i){const it=editing(),hit=IA.misconceptionFor(it,i);if(hit){it.rationales[i]=hit;render()}}
function setTab(t){if(route()==='review')state.reviewTab=t;else state.draftTab=t;render()}
function suggestion(it,i){const hit=IA.misconceptionFor(it,i);if(!hit||it.rationales[i].trim()===hit)return '';return `Detected: ${esc(hit)} · <button class="btn-link" onclick="useSuggestion(${i})">Use this</button>`}
// Typing updates the analysis and suggestions in place so inputs keep focus.
function refresh(){const it=editing(),panel=document.getElementById('side-panel'),comps=document.getElementById('components-field'),cognia=document.getElementById('cognia-suggest');if(panel)panel.innerHTML=sidePanel();if(comps)comps.innerHTML=componentsField(it);if(cognia)cognia.outerHTML=cogniaSuggestions(it);it.choices.forEach((_,i)=>{const el=document.getElementById('sugg-'+i);if(el)el.innerHTML=suggestion(it,i)});if(route()==='review'){const text=document.getElementById('qtext-'+state.reviewSel),status=document.getElementById('qstatus-'+state.reviewSel);if(text)text.textContent=it.stem;if(status)status.innerHTML=statusChip(it)}}
function sidePanel(){return route()==='review'?reviewSide():analysisPanel(state.draft)}
function supportCount(it){return Object.values(it.supports).filter(s=>s.on).length}

function editor(it){const tab=route()==='review'?state.reviewTab:state.draftTab,tabs=[['write','Write'],['supports','Learner supports'],['preview','Preview']],n=supportCount(it);

return `<section class="card editor"><div class="editor-head"><div class="seg" role="tablist">${tabs.map(([k,l])=>`<button role="tab" aria-selected="${tab===k}" class="${tab===k?'on':''}" onclick="setTab('${k}')">${l}${k==='supports'&&n?` <span class="count">${n}</span>`:''}</button>`).join('')}</div>${sourceChip[it.source]}</div>
${tab==='write'?(it.source==='bank'?readOnlyItem(it):writeTab(it)):tab==='supports'?supportsTab(it):previewTab(it)}</section>`}
function readOnlyItem(it){const p=ELA.passageOf(it);return `<div class="banner neutral">This is a reviewed Cognia item. Edit a copy to make your own version; the original stays in the Item Bank. You can add learner supports without copying.</div>${p?`<details class="passage-peek"><summary>Passage: ${esc(p.title)}</summary>${ELA.passageHTML(p)}</details>`:''}
<div class="chips">${stdChip(it.standard)}<span class="chip">DOK ${it.dok}</span><span class="chip">${plural(it.marks,'point')}</span>${it.components.map(c=>`<span class="chip info">${esc(c)}</span>`).join('')}</div>
<p class="ro-stem">${esc(it.stem)}</p>${it.type==='mc'?it.choices.map((c,i)=>`<div class="choice ro ${i===it.correct?'is-key':''}"><span class="letter">${IA.letters[i]}</span><div><div>${esc(c)}</div><div class="small muted">${i===it.correct?'Correct answer':esc(it.rationales[i])}</div></div></div>`).join(''):`<label>Exemplar response</label><p class="small">${esc(it.exemplar)}</p>${it.rubric?`<label>Rubric</label>${lines(it.rubric).map(l=>`<p class="small">${esc(l)}</p>`).join('')}`:''}`}
<div class="actions"><button class="btn primary" onclick="editCopy()">Edit a copy</button></div>`}

// ELA: every item is answered from a passage, chosen from Cognia or written by the educator.

function passageField(it){if(!ELA.isELA(it))return '';const p=ELA.passageOf(it);

function writeTab(it){return `${it.source==='copy'?'<div class="banner neutral">Your version of a Cognia item. The original stays unchanged in the Item Bank. <button class="btn-link" onclick="revertCopy()">Revert to original</button></div>':''}${passageField(it)}<div class="field-row four"><div><label for="f-type">Item type</label><select id="f-type" onchange="setField('type',this.value,true)">${opt('mc','Multiple choice',it.type)}${opt('cr','Constructed response',it.type)}</select></div>

<label for="f-stem">Item</label><textarea id="f-stem" rows="5" oninput="setField('stem',this.value)" placeholder="Write the question students will see.">${esc(it.stem)}</textarea>
<div id="components-field">${componentsField(it)}</div>
${it.type==='mc'?`<label>Answer options</label><p class="hint">Select the correct answer. For each wrong answer, name the misconception it reveals.</p>${it.choices.map((c,i)=>choiceRow(it,c,i)).join('')}`
:`<label for="f-ex">Exemplar response</label><textarea id="f-ex" rows="4" oninput="setField('exemplar',this.value)" placeholder="What does a complete, correct response include?">${esc(it.exemplar)}</textarea>${rubricField(it)}`}`}
function choiceRow(it,c,i){const isKey=it.correct===i,L=IA.letters[i];
return `<div class="choice ${isKey?'is-key':''}"><span class="letter">${L}</span><div class="choice-body"><input id="f-c${i}" aria-label="Option ${L}" value="${esc(c)}" oninput="setChoice(${i},this.value)">${isKey?'<div class="key-note">Correct answer</div>':`<input class="rationale" aria-label="Misconception for option ${L}" value="${esc(it.rationales[i])}" oninput="setRationale(${i},this.value)" placeholder="What misconception does this option reveal?"><div class="suggest" id="sugg-${i}">${suggestion(it,i)}</div>`}</div><label class="key-pick"><input type="radio" name="answer-key" ${isKey?'checked':''} onchange="setCorrect(${i})"> Correct</label></div>`}
function supportEditor(it,k){const s=it.supports[k];
if(k==='language')return `<label for="sup-lang">Simplified question</label><textarea id="sup-lang" rows="4" oninput="setSupport('language','text',this.value)">${esc(s.text)}</textarea><label for="sup-gloss">Word help (one term per line)</label><textarea id="sup-gloss" rows="4" oninput="setSupport('language','glossary',this.value)">${esc(s.glossary)}</textarea><button class="btn-link" onclick="regen('language')">↻ Regenerate from question</button>`;
if(k==='visual')return visualModel(it)||'<p class="hint">No fractions found in the question to model.</p>';
if(k==='audio')return `${it.passage?`<button class="btn sm" onclick="speakPassage('${it.passage}')">🔊 Listen to the passage</button> `:''}<button class="btn sm" onclick="speakItem('${it.id}',false)">🔊 Listen to the question</button>`;
return `<label for="sup-${k}">${k==='steps'?'Steps':'Challenge prompt'}</label><textarea id="sup-${k}" rows="${k==='steps'?6:3}" oninput="setSupport('${k}','text',this.value)">${esc(s.text)}</textarea><button class="btn-link" onclick="regen('${k}')">↻ Regenerate from question</button>`}
function supportsTab(it){return `<div class="banner">Same question, different ways in. Turn on the supports you want to review now. You assign them to students in the Assign step, and you can offer some to every student as optional tools.</div>
${Object.entries(SUPPORTS).map(([k,s])=>`<div class="support ${it.supports[k].on?'on':''}"><div class="row"><div><h3>${s.name}</h3><p class="hint">${s.desc}</p></div><label class="switch"><input type="checkbox" aria-label="${s.name}" ${it.supports[k].on?'checked':''} onchange="toggleSupport('${k}')"><span>${it.supports[k].on?'On':'Off'}</span></label></div>${it.supports[k].on?supportEditor(it,k):''}</div>`).join('')}`}
function previewTab(it){const on=new Set(Object.keys(it.supports).filter(k=>it.supports[k].on));
return `<div class="compare"><div><h3>Standard version</h3><div class="sq-frame">${studentQuestion(it,new Set())}</div></div><div><h3>With learner supports</h3>${on.size?`<div class="sq-frame">${studentQuestion(it,on)}</div>`:'<div class="empty small">Turn on supports in the Learner supports tab to see a supported version.</div>'}</div></div>`}

const FIX_LABELS={simplify:'Use simpler wording',order:'Reorder options'};
function checkList(checks,editable){const icon={pass:'✓',warn:'!',info:'i'};return `<ul class="checks">${checks.map(c=>`<li class="${c.status}"><span class="ci" aria-hidden="true">${icon[c.status]}</span><div><strong>${esc(c.label)}</strong><small>${esc(c.detail)}</small>${editable&&c.fix?`<button class="btn sm fix" onclick="applyFix('${c.fix}')">${FIX_LABELS[c.fix]}</button>`:''}</div></li>`).join('')}</ul>`}
function analysisPanel(it){const a=IA.analyze(it,{grade:+state.grade}),scored=a.checks.filter(c=>c.status!=='info'),passed=scored.filter(c=>c.status==='pass').length;
return `<div class="eyebrow">Item analysis</div><h2 class="panel-title">${passed} of ${scored.length} checks passed</h2><div class="meter"><div style="width:${scored.length?Math.round(passed/scored.length*100):0}%"></div></div>
${a.read?`<div class="metrics"><div><strong>${a.read.grade.toFixed(1)}</strong><span>Reading grade</span></div><div><strong>${a.read.words}</strong><span>Words</span></div><div><strong>DOK ${a.dok}</strong><span>Estimated</span></div></div>`:''}${it.source==='bank'?'<p class="hint">Reviewed by Cognia. Edit a copy to change it.</p>':''}${checkList(a.checks,it.source!=='bank')}${supportSummary(it)}`}
function supportSummary(it){const s=it.supports,rows=[];
if(s.language.on&&s.language.text.trim()){const before=IA.readability(it.stem),after=IA.readability(s.language.text);if(before&&after)rows.push(`Language support: reading level Grade ${before.grade.toFixed(1)} → ${after.grade.toFixed(1)}`)}
if(s.visual.on&&ELA.isELA(it))rows.push('Graphic organizer matched to the reading skill');else if(s.visual.on){const fr=IA.fractionsIn(it.stem);rows.push(fr.length?`Visual model: fraction bars for ${fr.slice(0,3).map(f=>f.raw).join(' and ')}`:'Visual model: no fractions found to model')}
if(s.audio.on)rows.push(it.passage?'Read aloud: passage, question and options':'Read aloud: question and options');
if(s.steps.on)rows.push(`Step-by-step hint: ${plural(lines(s.steps.text).length,'step')}`);
if(s.extend.on)rows.push('Extension: challenge prompt');
return `<h3 class="sub">Learner supports</h3>${rows.length?`<ul class="bullets">${rows.map(r=>`<li>${esc(r)}</li>`).join('')}</ul><p class="hint">Supports change how students access the question, not what it measures.</p>`:`<p class="hint">None reviewed yet. <button class="btn-link" onclick="setTab('supports')">Add learner supports →</button></p>`}`}

// Student-facing question, used in teacher previews and the student view
function supportContent(it,k){const s=it.supports[k],authored=s.on&&!!(s.text||'').trim();
if(k==='language'){const text=authored?s.text:IA.simplify(it.stem);return {text,glossary:authored?s.glossary:glossaryFor(it,text),authored}}
return {text:authored?s.text:IA.generate(k,it),authored}}
function studentQuestion(it,active,answer,onAnswer){const lang=active.has('language')?supportContent(it,'language'):null,stem=lang?lang.text:it.stem,p=ELA.passageOf(it);
const q=`<div class="sq">${active.has('audio')?`<button class="btn sm listen" onclick="speakItem('${it.id}',${!!lang})">🔊 Read aloud</button>`:''}${p&&!onAnswer?`<details class="passage-peek"><summary>Passage: ${esc(p.title||'Untitled passage')}</summary>${ELA.passageHTML(p)}</details>`:''}<p class="sq-stem">${stem.trim()?esc(stem):'<span class="muted">Your question will appear here.</span>'}</p>${active.has('visual')?visualModel(it,!!onAnswer):''}
${lang&&lang.glossary.trim()?`<div class="sq-help"><strong>Word help</strong>${lines(lang.glossary).map(l=>`<div>${esc(l)}</div>`).join('')}</div>`:''}
${it.type==='mc'?`<p class="sq-direction">Choose one answer</p>${it.choices.map((c,i)=>`<button class="sq-option ${answer===i?'picked':''}" ${onAnswer?`onclick="${onAnswer}(${i})" aria-pressed="${answer===i}"`:'tabindex="-1"'}><b>${IA.letters[i]}</b><span>${esc(c)}</span></button>`).join('')}`:`<textarea class="sq-response" rows="4" aria-label="Your answer" placeholder="Type your answer" ${onAnswer?'':'disabled'}></textarea>`}
${active.has('steps')?`<details class="sq-hint"><summary>Need a hint? Try these steps</summary>${lines(supportContent(it,'steps').text).map(l=>`<p>${esc(l)}</p>`).join('')}</details>`:''}
${active.has('extend')?`<div class="sq-challenge"><strong>Challenge</strong><div>${esc(supportContent(it,'extend').text)}</div></div>`:''}</div>`;
return p&&onAnswer?`<div class="sq-split"><div class="passage-pane">${active.has('audio')?`<button class="btn sm listen" onclick="speakPassage('${it.passage}')">🔊 Read the passage</button>`:''}${ELA.passageHTML(p)}</div>${q}</div>`:q}
function speakPassage(id){if(!window.speechSynthesis)return toast('Read aloud is not available in this browser.');const p=ELA.resolve(id);if(!p)return;speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(p.title+'. '+ELA.paragraphs(p.text).join(' ')))}
function speakItem(id,useLanguage){if(!window.speechSynthesis)return toast('Read aloud is not available in this browser.');const it=state.items.find(x=>x.id===id)||state.draft,stem=useLanguage?supportContent(it,'language').text:it.stem,text=[stem,...(it.type==='mc'?it.choices.map((c,i)=>`${IA.letters[i]}: ${c}`):[])].join('. ');speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(IA.speakable(text)))}

// Create: questions
function setMode(m){if(m==='ai')return toast('Generate with AI is a Classroom+ feature and is not part of this prototype.');state.mode=m;render()}
function newDraft(kind){state.justAdded=null;state.draft=kind==='sample'?sampleDraft():makeItem({},state.standard);state.draftTab='write';render()}
function addDraft(){const d=state.draft;if(!d.stem.trim())return toast('Write an item first.');if(ELA.isELA(d)&&!d.passage)return toast('Choose or write a passage first.');const it=clone(d);it.id='q'+state.nextId++;it.source='teacher';if(!it.components.length)it.components=KG.suggestComponents(it);state.items.push(it);state.draft=makeItem({},state.standard);state.draftTab='write';state.justAdded=state.items.length-1;render();document.querySelector('.added-card')?.scrollIntoView({block:'center'})}
// After a question is added, a confirmation replaces the editor until the teacher chooses what to do next.
function justAddedItem(){const i=state.justAdded;return i!=null&&state.items[i]?state.items[i]:null}
function writeAnother(){state.justAdded=null;render()}
function reviewAdded(){state.reviewSel=state.justAdded;state.justAdded=null;go('review')}
function addedSupportsNote(it){const on=Object.keys(SUPPORTS).filter(k=>it.supports[k].on);return {chips:on.map(k=>`<span class="chip info">${SUPPORTS[k].name}</span>`).join(''),note:on.length?'Its learner supports were saved with it.':''}}
function addedCard(){const i=state.justAdded,it=state.items[i],s=addedSupportsNote(it);
return `<section class="card added-card" role="status"><div class="added-head"><span class="added-check" aria-hidden="true">✓</span><div><div class="eyebrow">Item ${i+1} added to your assessment</div><p class="added-stem">${esc(it.stem)}</p></div></div>
<div class="chips"><span class="chip">${stdCode(it.standard)}</span><span class="chip">${typeLabel(it)}</span><span class="chip">DOK ${it.dok}</span>${s.chips}</div>
<p class="hint">${s.note} You can change it any time in Review.</p>
<div class="actions"><button class="btn" onclick="reviewAdded()">Edit in Review</button><button class="btn primary" onclick="writeAnother()">Write another item</button></div></section>`}
function addBank(id){state.items.push(fromBank(id,state));render()}
function removeItem(i){state.justAdded=null;state.items.splice(i,1);state.reviewSel=Math.max(0,Math.min(state.reviewSel,state.items.length-1));render()}
function clearItems(){state.justAdded=null;state.items=[];state.reviewSel=0;render()}
function setBankFilter(k,v){state.bankFilter[k]=v;render()}
function optionCard(k,title,desc,icon){const on=state.mode===k;return `<button class="option ${on?'selected':''}" aria-pressed="${on}" onclick="setMode('${k}')"><span class="option-icon" aria-hidden="true">${icon}</span><span><strong>${title}</strong><small>${desc}</small></span>${k==='ai'?'<span class="chip plus">Classroom+</span>':''}${on?'<span class="tick" aria-hidden="true">✓</span>':''}</button>`}
function assessmentList(){const n=state.items.length;
return `<section class="card"><div class="row"><h2>${plural(n,'item')} in your assessment</h2>${n?'<button class="btn sm" onclick="clearItems()">Clear all</button>':''}</div>
${n?state.items.map((it,i)=>`<div class="qline"><span class="qnum">${i+1}</span><div><span class="chip">${typeLabel(it)}</span><p>${esc(it.stem)}</p>${statusChip(it)}</div><button class="icon-btn" aria-label="Remove item ${i+1}" onclick="removeItem(${i})">×</button></div>`).join(''):'<div class="empty"><strong>Build your assessment</strong><p class="small muted">Choose items from the bank or create your own.</p></div>'}</section>`}
function passageNote(b){const p=ELA.passageOf(b);return p?`<small class="muted passage-note">📄 ${esc(p.title)}</small>`:''}
function bankList(){const f=state.bankFilter,q=f.q.toLowerCase(),rows=BANK.filter(b=>inSubject(b)&&(f.standard==='all'||b.standard===f.standard)&&(f.type==='all'||b.type===f.type)&&(!q||b.stem.toLowerCase().includes(q)));
return `<section class="card"><h2>Find and add items</h2><p class="muted small">Existing Cognia items for Grade ${esc(state.grade)} ${esc(state.subject)}${alabama()?`, aligned to the ${stateSource()}`:''}.</p>
<div class="field-row three"><div><label for="bk-q">Search items</label><input id="bk-q" value="${esc(f.q)}" onchange="setBankFilter('q',this.value)" placeholder="e.g., sum"></div><div><label for="bk-std">Standard</label><select id="bk-std" onchange="setBankFilter('standard',this.value)">${opt('all','All standards',f.standard)}${[...new Set(BANK.filter(inSubject).map(b=>b.standard))].map(s=>opt(s,stdName(s),f.standard)).join('')}</select></div><div><label for="bk-type">Type</label><select id="bk-type" onchange="setBankFilter('type',this.value)">${opt('all','All types',f.type)}${opt('mc','Multiple choice',f.type)}${opt('cr','Constructed response',f.type)}</select></div></div>
<p class="small muted">${plural(rows.length,'matching item')}</p>${rows.map(b=>{const added=state.items.some(it=>it.bankId===b.id);return `<div class="bank-row"><div><span class="chip">${b.type==='mc'?'Multiple choice':'Constructed response'}</span><p>${esc(b.stem)}</p>${passageNote(b)}<small class="muted">${stdCode(b.standard)} · DOK ${b.dok} · ${b.difficulty} · ${plural(b.marks,'point')}${STANDARDS[b.standard].grade<+state.grade?' · Prerequisite':''}</small></div><button class="btn sm ${added?'':'primary'}" ${added?'disabled':''} onclick="addBank('${b.id}')">${added?'✓ Added':'+ Add'}</button></div>`}).join('')}</section>`}
function pageQuestions(){return topbar('assessments')+`<main class="page">${pageHead(0,'Create your items','Choose the fastest option for you. You can always edit them later.')}
<div class="options">${optionCard('bank','Use item bank','Search and add existing, trusted items.','▤')}${optionCard('manual','Create manually','Build your own items with built-in item analysis.','✎')}</div>
${state.mode==='bank'?`<div class="grid-2"><div>${bankList()}</div><aside>${assessmentList()}</aside></div>`
:`<div class="grid-2"><div><div class="section-head"><div><h2>Make it your own</h2><p class="muted small">Write an item for your lesson. The item analysis updates as you type.</p></div><div class="row-actions"><button class="btn-link" onclick="newDraft('sample')">Load sample</button><button class="btn-link" onclick="newDraft('blank')">Start blank</button></div></div>${justAddedItem()?addedCard():editor(state.draft)+'<div class="actions"><button class="btn primary" onclick="addDraft()">Add to assessment</button></div>'}</div>
<aside class="side"><section class="card" id="side-panel" aria-live="polite">${analysisPanel(justAddedItem()||state.draft)}</section>${cogniaSuggestions(justAddedItem()||state.draft)}${assessmentList()}</aside></div>`}</main>`+bottomBar('Continue to review','review','setup')}
function bankMini(b,reason){return `<div class="mini"><div>${reason?`<div class="reason">${esc(reason)}</div>`:''}<p>${esc(b.stem)}</p>${passageNote(b)}<div class="chips"><span class="chip">${stdCode(b.standard)}</span><span class="chip">DOK ${b.dok}</span><span class="chip">${b.type==='mc'?'Multiple choice':'Constructed response'}</span></div></div><button class="btn sm" onclick="addBank('${b.id}')">+ Add</button></div>`}
// Cognia items for the standard being written to, closest learning components first.
function cogniaSuggestions(it){const want=new Set(it.components.length?it.components:KG.suggestComponents(it)),score=b=>b.components.filter(c=>want.has(c)).length+(it.passage&&b.passage===it.passage?2:0),rows=BANK.filter(b=>b.standard===it.standard&&!state.items.some(x=>x.bankId===b.id)).sort((a,b)=>score(b)-score(a)).slice(0,3);
return `<section class="card" id="cognia-suggest"><div class="eyebrow">From Cognia</div><h2>Items for ${stdCode(it.standard)}</h2><p class="hint">Reviewed items you can mix in with your own.</p>${rows.length?rows.map(b=>bankMini(b)).join(''):'<p class="hint">You’ve added every Cognia item for this standard.</p>'}</section>`}

// Create: review
function rollup(){const grade=+state.grade,rows=state.items.map((it,i)=>({it,i,a:IA.analyze(it,{grade})})),r={rows,flagged:rows.filter(x=>x.a.checks.some(c=>c.status==='warn')),dok:{1:0,2:0,3:0},standards:{},keys:{verified:0,issue:0,unchecked:0},wrong:{named:0,total:0},reading:[],supports:{}};
rows.forEach(({it,a})=>{r.dok[it.dok]++;r.standards[it.standard]=(r.standards[it.standard]||0)+1;r.keys[a.keyStatus]++;if(a.read)r.reading.push(a.read.grade);if(it.type==='mc')[0,1,2,3].forEach(i=>{if(i!==it.correct){r.wrong.total++;if(it.rationales[i].trim())r.wrong.named++}});Object.keys(SUPPORTS).forEach(k=>{if(it.supports[k].on)r.supports[k]=(r.supports[k]||0)+1})});
r.avgReading=r.reading.length?r.reading.reduce((a,b)=>a+b,0)/r.reading.length:0;r.aboveGrade=r.reading.filter(g=>g>=grade+1).length;return r}
// Cognia items that fill what the assessment is missing: the selected standard, DOK 3, learning components, prerequisites.
function gaps(){const avail=BANK.filter(b=>inSubject(b)&&!state.items.some(it=>it.bankId===b.id)),out=[],push=(b,reason)=>{if(b&&!out.some(o=>o.b.id===b.id))out.push({b,reason})},target=KG.get(state.standard),covered=new Set(state.items.flatMap(it=>it.components));
if(!state.items.some(it=>it.standard===state.standard))push(avail.find(b=>b.standard===state.standard),`Covers ${stdCode(state.standard)}, your selected standard`);
if(!state.items.some(it=>+it.dok===3))push(avail.find(b=>b.dok===3&&b.standard===state.standard)||avail.find(b=>b.dok===3),'Adds a DOK 3 item to see reasoning');
target.components.filter(c=>!covered.has(c)).forEach(c=>push(avail.find(b=>b.components.includes(c)),`Covers “${c}”`));
target.prereqs.filter(p=>!state.items.some(it=>it.standard===p)).forEach(p=>push(avail.find(b=>b.standard===p),`Checks readiness: ${stdName(p)}`));
return out.slice(0,4)}
function selectQuestion(i,panel){state.reviewSel=i;if(panel)state.reviewPanel=panel;render()}
function moveItem(i,d){const j=i+d;if(j<0||j>=state.items.length)return;[state.items[i],state.items[j]]=[state.items[j],state.items[i]];state.reviewSel=j;render()}
function setReviewPanel(p){state.reviewPanel=p;render()}
function rollupPanel(){const r=rollup(),n=state.items.length,ready=n-r.flagged.length,t=totals(),grade=+state.grade;
const dokBar=[1,2,3].map(d=>r.dok[d]?`<div class="dok d${d}" style="flex:${r.dok[d]}" title="DOK ${d}: ${r.dok[d]}">${r.dok[d]}</div>`:'').join('');
return `<div class="eyebrow">Whole assessment</div><h2 class="panel-title">${ready} of ${n} items ready</h2><div class="meter"><div style="width:${n?Math.round(ready/n*100):0}%"></div></div><p class="hint">Suggestions are advice. You can continue at any time.</p>
${r.flagged.length?`<h3 class="sub">Needs attention</h3><ul class="attention">${r.flagged.map(({i,a})=>{const w=a.checks.filter(c=>c.status==='warn');return `<li><button class="btn-link" onclick="selectQuestion(${i},'item')">Item ${i+1}</button> · ${esc(w[0].label)}${w.length>1?` <span class="muted">+${w.length-1} more</span>`:''}</li>`}).join('')}</ul>`:''}
${(()=>{const g=gaps();return g.length?`<h3 class="sub">Fill gaps with Cognia items</h3>${g.map(({b,reason})=>bankMini(b,reason)).join('')}`:''})()}
<h3 class="sub">${alabama()?KG.state+' standards':'Standards'} coverage</h3><ul class="kv">${Object.entries(r.standards).map(([s,c])=>`<li><span>${stdCode(s)}${STANDARDS[s]&&STANDARDS[s].grade<grade?' (prerequisite)':''}</span><strong>${plural(c,'item')}</strong></li>`).join('')}${r.standards[state.standard]?'':`<li class="warn-text">No items yet for ${stdCode(state.standard)}, your selected standard.</li>`}</ul>
<h3 class="sub">Learning components · ${stdCode(state.standard)}</h3><ul class="kv">${KG.get(state.standard).components.map(c=>{const n=state.items.filter(it=>it.components.includes(c)).length;return `<li class="${n?'':'warn-text'}"><span>${esc(c)}</span><strong>${n?plural(n,'item'):'Not covered'}</strong></li>`}).join('')}</ul>
${(()=>{const ids=[...new Set(state.items.map(it=>it.passage).filter(Boolean))];return ids.length?`<h3 class="sub">Passages</h3><ul class="kv">${ids.map(id=>{const p=ELA.resolve(id),st=ELA.passageStats(p);return `<li><span>${esc(p.title||'Untitled passage')} · ${p.source==='teacher'?'yours':'Cognia'}</span><strong>${st.words} words · Gr ${st.grade.toFixed(1)} · ${plural(state.items.filter(it=>it.passage===id).length,'item')}</strong></li>`}).join('')}</ul>`:''})()}
<h3 class="sub">Prerequisites</h3><ul class="kv">${KG.get(state.standard).prereqs.map(p=>{const n=state.items.filter(it=>it.standard===p).length;return `<li><span>${esc(stdName(p))}</span><strong>${n?'Checked':'Not checked'}</strong></li>`}).join('')||'<li><span>None listed</span></li>'}</ul>
<h3 class="sub">Depth of knowledge</h3><div class="dokbar">${dokBar}</div><div class="legend"><span><i class="d1"></i>DOK 1 recall</span><span><i class="d2"></i>DOK 2 skill</span><span><i class="d3"></i>DOK 3 reasoning</span></div>${n&&!r.dok[3]?'<p class="hint">No DOK 3 items. Add one that asks students to explain or justify to see their reasoning.</p>':''}

const maxMisses=Math.max(1,Math.round(r.items.length/3));r.students.forEach(name=>{const prof=PROFILES[name]||[];let misses=0;r.responses[name]={};r.items.forEach(it=>{let resp;
if(it.type==='mc'){const miss=misses<maxMisses?prof.map(m=>it.rationales.findIndex((t,i)=>i!==it.correct&&norm(t)===norm(m))).find(i=>i>=0):undefined,choice=miss??it.correct;if(miss!==undefined)misses++;resp={choice,earned:choice===it.correct?+it.marks:0}}
else resp={earned:prof.length?Math.max(0,+it.marks-1):+it.marks};
r.responses[name][it.id]=resp})});
toast(`Simulated responses from ${plural(r.students.length,'student')}.`);render()}
function compStandard(c){return Object.keys(STANDARDS).find(k=>STANDARDS[k].components.includes(c))}
function resultsData(){const r=state.results,items=r.items,names=r.students,resp=r.responses,total=items.reduce((s,it)=>s+ +it.marks,0),wrongLabel=(it,c)=>it.rationales[c].trim()||UNLABELED;
const students=names.map(n=>{const earned=items.reduce((s,it)=>s+resp[n][it.id].earned,0);return {name:n,earned,pct:Math.round(earned/total*100),miscon:[...new Set(items.filter(it=>it.type==='mc'&&resp[n][it.id].choice!==it.correct).map(it=>wrongLabel(it,resp[n][it.id].choice)))]}});
const groups={};items.forEach((it,qi)=>{if(it.type!=='mc')return;names.forEach(n=>{const c=resp[n][it.id].choice;if(c===it.correct)return;const label=wrongLabel(it,c),g=groups[label]||(groups[label]={label,students:new Set(),questions:new Set(),components:new Set()});g.students.add(n);g.questions.add(qi+1);it.components.forEach(x=>g.components.add(x))})});
const questions=items.map((it,qi)=>{const earned=names.reduce((s,n)=>s+resp[n][it.id].earned,0);return {it,qi,pct:Math.round(earned/(names.length*it.marks)*100),dist:it.type==='mc'?it.choices.map((_,i)=>names.filter(n=>resp[n][it.id].choice===i).length):names.reduce((d,n)=>{const e=resp[n][it.id].earned;d[e===+it.marks?0:e?1:2]++;return d},[0,0,0])}});
const comps={};items.forEach((it,qi)=>it.components.forEach(c=>{const x=comps[c]||(comps[c]={c,earned:0,possible:0,questions:[]});names.forEach(n=>{x.earned+=resp[n][it.id].earned;x.possible+= +it.marks});x.questions.push(qi+1)}));
return {total,students,questions,avg:Math.round(students.reduce((s,x)=>s+x.pct,0)/students.length),
groups:Object.values(groups).sort((a,b)=>(a.label===UNLABELED)-(b.label===UNLABELED)||b.students.size-a.students.size),
components:Object.values(comps).map(x=>({...x,pct:Math.round(x.earned/x.possible*100)})).sort((a,b)=>a.pct-b.pct)}}
// Starts a new assessment for one misconception group: their prerequisite item first, then Cognia items that can detect the same error.
function startFollowUp(gi){const r=state.results,g=resultsData().groups[gi],used=new Set(r.items.map(it=>it.bankId)),prereq=PREREQ_FOR[g.label],detects=b=>b.type==='mc'&&b.rationales.some(t=>norm(t)===norm(g.label));
if(r.items.some(it=>ELA.isELA(it))!==isELASubject())switchSubject(r.items.some(it=>ELA.isELA(it))?ELA.SUBJECT:'Mathematics');
const picks=[...BANK.filter(b=>prereq&&b.standard===prereq),...BANK.filter(b=>detects(b)&&!used.has(b.id)),...BANK.filter(detects)],chosen=[...new Map(picks.map(b=>[b.id,b])).values()].slice(0,3);
Object.assign(state,{title:'Follow-up: '+g.label,items:[],assigned:false,reviewSel:0,reviewPanel:'item',reviewTab:'write',draft:makeItem({},state.standard),student:{as:'__all',q:0,answers:{},tools:{}}});
chosen.forEach(b=>state.items.push(fromBank(b.id,state)));state.details.ack=false;state.assign.ack=false;
Object.keys(state.assign.selected).forEach(n=>state.assign.selected[n]=g.students.has(n));
toast(`Follow-up check started for ${plural(g.students.size,'student')} with ${plural(chosen.length,'Cognia item')}. Add your own items too.`);go('review')}

function meter(pct){return `<div class="rbar ${pct<60?'low':pct<80?'mid':''}"><div style="width:${pct}%"></div></div>`}
function misconceptionsView(d){return `<p class="hint">Students are grouped by the wrong answers they chose. Each group shares a misconception you named, or the item analysis detected, when you built the assessment.</p>
${d.groups.length?d.groups.map((g,gi)=>{const pre=PREREQ_FOR[g.label],ps=pre&&KG.get(pre),unlabeled=g.label===UNLABELED;
return `<section class="card group"><div class="group-head"><div><div class="eyebrow">${plural(g.students.size,'student')}</div><h2>${esc(g.label)}</h2><p class="small muted">Seen in ${[...g.questions].map(q=>'Q'+q).join(', ')}${g.components.size?' · '+[...g.components].map(esc).join('; '):''}</p></div>${unlabeled?'':`<button class="btn primary" onclick="startFollowUp(${gi})">Build a follow-up check</button>`}</div>

function standardsView(d){const rows={};d.questions.forEach(({it,qi})=>{const x=rows[it.standard]||(rows[it.standard]={code:it.standard,earned:0,possible:0,items:[]});state.results.students.forEach(n=>{x.earned+=state.results.responses[n][it.id].earned;x.possible+= +it.marks});x.items.push(qi+1)});
const list=Object.values(rows).map(x=>({...x,pct:Math.round(x.earned/x.possible*100)})).sort((a,b)=>a.pct-b.pct);
return `<p class="hint">Percent of possible points on the items aligned to each ${alabama()?KG.state+' ':''}standard, lowest first.</p><section class="card">${list.map(x=>`<div class="rrow"><div><strong>${esc(stdName(x.code))}</strong><div class="small muted">${alabama()?'National '+x.code+' · ':''}${x.items.map(q=>'Q'+q).join(', ')}</div></div>${meter(x.pct)}<strong class="rpct">${x.pct}%</strong></div>`).join('')}<p class="source">${alabama()?`Standards from the ${stateSource()} (labeled sample).`:`Standards from the ${KG.source} (sample data).`}</p></section>`}

const BANDS=[['<50',0,49],['50–59',50,59],['60–69',60,69],['70–79',70,79],['80–89',80,89],['90–100',90,100]];
function statTile(icon,label,value,note){return `<div class="card stat tile"><span class="stat-icon" aria-hidden="true">${icon}</span><div><span>${label}</span><strong>${value}</strong><small>${note}</small></div></div>`}
function setResultsFilter(f){state.resultsFilter=f;render()}
function studentResults(d){const f=state.resultsFilter||'all',rows=f==='all'||f==='scored'?d.students:[];
return `<section class="card"><div class="row"><h2>Student results</h2><div class="seg">${[['all','All'],['review','Needs review'],['scored','Scored'],['missing','Not submitted']].map(([k,l])=>`<button class="${f===k?'on':''}" aria-pressed="${f===k}" onclick="setResultsFilter('${k}')">${l}</button>`).join('')}</div></div>
<div class="row-actions results-links"><button class="btn-link" onclick="toast('Everyone submitted in this simulation, so there are no missing submissions.')">Missing submissions</button><button class="btn-link" onclick="state.resultsTab='misconceptions';document.getElementById('insights').scrollIntoView({behavior:'smooth'})">Learning insights</button><button class="btn-link" onclick="toast('Feedback release is not part of this prototype.')">Feedback release</button></div>
${rows.length?`<table class="table"><thead><tr><th>Student</th><th>Status</th><th>Score</th><th></th><th>Misconceptions shown</th><th>Feedback</th></tr></thead><tbody>${rows.map(s=>`<tr><td>${esc(s.name)}</td><td><span class="chip success">Scored</span></td><td>${s.earned} / ${d.total}</td><td class="tcell-bar">${meter(s.pct)}</td><td>${s.miscon.length?s.miscon.map(m=>`<span class="chip warning">${esc(m)}</span>`).join(' '):'<span class="chip success">None</span>'}</td><td><span class="chip">Private</span></td></tr>`).join('')}</tbody></table>`:'<p class="hint">No students in this group.</p>'}<p class="small muted">${plural(d.students.length,'student')} · Unsubmitted work has no score.</p></section>`}
function questionsView(d){return d.questions.map(({it,qi,pct,dist})=>{const n=state.results.students.length;
return `<section class="card"><div class="row"><div><div class="eyebrow">Item ${qi+1} · ${stdCode(it.standard)} · DOK ${it.dok}</div><p class="qstem">${esc(it.stem)}</p>${passageNote(it)}</div><strong class="rpct">${pct}%</strong></div>${meter(pct)}
${it.type==='mc'?it.choices.map((c,i)=>`<div class="optrow ${i===it.correct?'key':''}"><span class="letter">${IA.letters[i]}</span><div><div>${esc(c)} ${i===it.correct?'<span class="chip success">Correct</span>':''}</div><small class="muted">${i===it.correct?'':esc(it.rationales[i]||'No misconception named')}</small></div><div class="optbar"><div style="width:${n?dist[i]/n*100:0}%"></div></div><span class="small">${dist[i]}</span></div>`).join('')
:`<ul class="kv"><li><span>Full credit</span><strong>${dist[0]}</strong></li><li><span>Partial credit</span><strong>${dist[1]}</strong></li><li><span>No credit</span><strong>${dist[2]}</strong></li></ul>`}</section>`}).join('')}
function pageResults(){const r=state.results;
if(!r)return topbar('results')+`<main class="page"><div class="page-head"><div><h1>Review results</h1><p class="lede">See what needs your attention first.</p></div></div><div class="card empty"><strong>No assigned assessments yet.</strong><p class="small">Assign an assessment to see results here.</p><button class="btn primary" onclick="createAnother()">Create assessment</button></div></main>`;
const classes=Object.keys(ROSTER).filter(cls=>ROSTER[cls].some(st=>r.students.includes(st.name))).join(', '),total=r.items.reduce((s,it)=>s+ +it.marks,0),n=r.students.length;

<div class="stats four">${statTile('☺','Submitted',`0 / ${n}`,'Students submitted')}${statTile('✓','Scored','0','Auto-scored on hand-in')}${statTile('!','Needs review','0','Nothing to review by hand')}${statTile('%','Average score','—','Appears after the first hand-in')}</div></main>`;
const d=resultsData(),tab=['components','standards','questions'].includes(state.resultsTab)?state.resultsTab:'misconceptions',top=d.groups.find(g=>g.label!==UNLABELED),low=[...d.questions].sort((a,b)=>a.pct-b.pct)[0],tabs=[['misconceptions','Misconceptions'],['standards',alabama()?KG.state+' standards':'By standard'],['components','Learning components'],['questions','By item']];
const bands=BANDS.map(([l,lo,hi])=>({l,c:d.students.filter(s=>s.pct>=lo&&s.pct<=hi).length})),maxBand=Math.max(1,...bands.map(b=>b.c));
return topbar('results')+`<main class="page">${head}
<div class="stats four">${statTile('☺','Submitted',`${n} / ${n}`,'Students submitted')}${statTile('✓','Scored',n,'Auto-scored on hand-in')}${statTile('!','Needs review','0','Nothing to review by hand')}${statTile('%','Average score',d.avg+'%',`Across ${plural(n,'scored student')}`)}</div>
<div class="results-row"><section class="card"><h2>Score distribution</h2><p class="muted small">Submitted students · score range (%)</p><div class="histogram">${bands.map(b=>`<div><span>${b.c}</span><i style="height:${b.c/maxBand*100}%"></i><small>${b.l}</small></div>`).join('')}</div></section>
<section class="card"><h2>Performance by item</h2><p class="muted small">% of points earned</p>${d.questions.map(q=>`<div class="perf"><span>Q${q.qi+1}</span>${meter(q.pct)}<strong>${q.pct}%</strong></div>`).join('')}</section>
<section class="card insights"><h2>Key insights</h2><ul class="checks">${checkLine(d.avg>=70,`${d.avg}% average score`,`Across ${plural(n,'scored student')}.`)}${top?checkLine(false,`${plural(top.students.size,'student')} share a misconception`,esc(top.label)):''}${checkLine(low.pct>=70,`Q${low.qi+1} is the lowest-scoring item`,`${low.pct}% of possible points earned.`)}</ul><button class="btn-link" onclick="setResultsTab('misconceptions');document.getElementById('insights').scrollIntoView({behavior:'smooth'})">Open learning insights →</button></section></div>
<section id="insights" class="insights-section"><div class="row"><div><h2 class="section-title">Learning insights</h2><p class="muted small">Use the response evidence to decide what to teach next.</p></div><div class="seg results-tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" aria-selected="${tab===k}" class="${tab===k?'on':''}" onclick="setResultsTab('${k}')">${l}</button>`).join('')}</div></div>
${tab==='components'?componentsView(d):tab==='standards'?standardsView(d):tab==='questions'?questionsView(d):misconceptionsView(d)}</section>
${studentResults(d)}</main>`}
// Student view (teacher preview)

function pageStudent(){if(!state.items.length)return emptyAssessment(2);const as=state.student.as,assigned=new Set(as==='__all'?[]:state.assign.supports[as]||[]),open=OPEN_TOOLS.filter(k=>state.details.tools[k]&&!assigned.has(k)),active=new Set([...assigned,...open.filter(k=>state.student.tools[k])]);

<script>
// Reflection questions: ungraded questions at the end of a test that ask students about their thinking.
// They live in state.reflections, apart from state.items, so they never add points, time or item analysis.
// Responses are reported in their own "Student thinking" tab in Results. Loads last, after any option file.

const REFL_SCALE=['Very sure','Somewhat sure','Not sure'];
function reflStarters(){const ela=isELASubject();return [
{type:'mc',prompt:'How sure are you about your answers?',choices:REFL_SCALE},
{type:'mc',prompt:'Which strategy did you use most?',choices:ela?['Reread the passage','Looked for key words','Used context clues','Guessed']:['Drew a model','Found a common denominator','Used a number line','Guessed']},
{type:'mc',prompt:'How did this test feel?',choices:['Easy','Just right','Hard']},
{type:'open',prompt:'Explain how you solved this item. What steps did you take?',about:true},
{type:'open',prompt:'What was the hardest part of this test? Why?'},
{type:'open',prompt:'What would you do differently next time?'}]}
function reflSeed(items){const s=reflStarters();return items.length?[
Object.assign(makeRefl(s[0]),{id:'r1'}),Object.assign(makeRefl(s[3]),{id:'r2',about:items[0].id,prompt:'Explain how you chose your answer to this item.'})]:[]}
function makeRefl(f){return {id:'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),type:f.type,prompt:f.prompt||'',choices:f.type==='mc'?[...(f.choices||['',''])]:[],about:f.about===true?(state.items[0]||{}).id||null:f.about||null}}
// Older saved demos have no reflections yet: give the sample assessment the starters so reviewers see them.
function refl(){if(!state.reflections)state.reflections=state.title==='New assessment'?[]:reflSeed(state.items);return state.reflections}
const itemNo=(items,id)=>items.findIndex(it=>it.id===id)+1;

// Each subject keeps its own reflection questions, and a new assessment starts with none.
SUBJECT_KEYS.push('reflections');
const baseFreshSubject=freshSubject;
freshSubject=function(subject){const s=baseFreshSubject(subject);s.reflections=reflSeed(s.items);return s};
const baseCreateAnother=createAnother;
createAnother=function(){baseCreateAnother();state.reflections=[];save()};
const baseDefaultState=defaultState;
defaultState=function(){const s=baseDefaultState();s.reflections=reflSeed(s.items);return s};

// Authoring
function addRefl(i){const f=i==null?null:reflStarters()[i];refl().push(makeRefl(f||{type:'open'}));state.reflOpen=false;render()}
function addReflOfType(type){refl().push(makeRefl({type}));render()}
function removeRefl(i){refl().splice(i,1);render()}
function setRefl(i,k,v,rerender){const r=refl()[i];r[k]=v||(k==='about'?null:v);if(k==='type')r.choices=v==='mc'?(r.choices.length?r.choices:['','']):[];save();if(rerender)render()}
function setReflChoice(i,c,v){refl()[i].choices[c]=v;save()}
function addReflChoice(i){refl()[i].choices.push('');render()}
function removeReflChoice(i,c){refl()[i].choices.splice(c,1);render()}
function moveRefl(i,d){const a=refl(),j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];render()}
function reflEditor(r,i){const n=refl().length;
return `<div class="refl"><div class="refl-head"><span class="qnum">R${i+1}</span><select aria-label="Format for reflection ${i+1}" onchange="setRefl(${i},'type',this.value,true)">${opt('mc','Multiple choice',r.type)}${opt('open','Open response',r.type)}</select>
<select aria-label="What reflection ${i+1} is about" onchange="setRefl(${i},'about',this.value,true)">${opt('','About the whole test',r.about||'')}${state.items.map((it,k)=>opt(it.id,`About item ${k+1}`,r.about||'')).join('')}</select>
<span class="reorder"><button class="icon-btn" aria-label="Move reflection ${i+1} up" ${i?'':'disabled'} onclick="moveRefl(${i},-1)">↑</button><button class="icon-btn" aria-label="Move reflection ${i+1} down" ${i<n-1?'':'disabled'} onclick="moveRefl(${i},1)">↓</button><button class="icon-btn" aria-label="Remove reflection ${i+1}" onclick="removeRefl(${i})">×</button></span></div>
<textarea rows="2" aria-label="Reflection question ${i+1}" oninput="setRefl(${i},'prompt',this.value)" placeholder="Ask about the student’s thinking, e.g., How did you check your answer?">${esc(r.prompt)}</textarea>
${r.about&&itemNo(state.items,r.about)?`<p class="small muted refl-about">Item ${itemNo(state.items,r.about)}: ${esc(state.items.find(it=>it.id===r.about).stem)}</p>`:''}
${r.type==='mc'?`<div class="refl-choices">${r.choices.map((c,k)=>`<div class="refl-choice"><span class="letter">${IA.letters[k]||k+1}</span><input aria-label="Reflection ${i+1} choice ${k+1}" value="${esc(c)}" onchange="setReflChoice(${i},${k},this.value)" placeholder="Choice ${k+1}">${r.choices.length>2?`<button class="icon-btn" aria-label="Remove choice ${k+1}" onclick="removeReflChoice(${i},${k})">×</button>`:''}</div>`).join('')}${r.choices.length<5?`<button class="btn-link" onclick="addReflChoice(${i})">+ Add choice</button>`:''}<p class="hint">No correct answer. Students pick the choice that fits them.</p></div>`:'<p class="hint">Students type their answer in their own words.</p>'}</div>`}
function reflectionCard(){const list=refl();
return `<section class="card refl-card" id="reflections"><div class="row"><div><h2>Reflection questions <span class="chip">Not graded</span></h2><p class="muted small">Students answer these at the end of the test. They don’t add points or time, and responses appear in Results under Student thinking.</p></div></div>
${list.length?list.map(reflEditor).join(''):'<p class="hint">No reflection questions yet. Add one to hear how students got to their answers.</p>'}
<div class="refl-add"><button class="btn sm" onclick="addReflOfType('mc')">+ Multiple choice</button><button class="btn sm" onclick="addReflOfType('open')">+ Open response</button><details class="refl-starters" ${state.reflOpen?'open':''} ontoggle="state.reflOpen=this.open"><summary class="btn-link">Use a starter question</summary><div class="refl-starter-list">${reflStarters().map((s,i)=>`<button class="refl-starter" onclick="addRefl(${i})"><span class="chip">${s.type==='mc'?'Multiple choice':'Open response'}</span>${esc(s.prompt)}</button>`).join('')}</div></details></div></section>`}
function reflCount(){const n=refl().length;return n?` · ${plural(n,'reflection question')}`:''}

// Page wrappers: route aliases (Option C maps several routes to one page) follow the new function.
function wrapPage(name,fn){const old=window[name],neu=function(){return fn(old.apply(this,arguments))};Object.keys(ROUTES).forEach(k=>{if(ROUTES[k]===old)ROUTES[k]=neu});window[name]=neu}
const beforeLastMain=(html,add)=>html.replace(/<\/main>(?![\s\S]*<\/main>)/,add+'</main>');
const baseBottomBar=bottomBar;
bottomBar=function(...a){return baseBottomBar(...a).replace(/(point|points)(<\/div><\/div><\/div>\s*<div class="bb-actions">)/,`$1${reflCount()}$2`)};
wrapPage('pageQuestions',html=>beforeLastMain(html,reflectionCard()));
wrapPage('pageReview',html=>{if(!state.items.length)return html;const at=html.indexOf('<details class="card settings"');return at>0?html.slice(0,at)+reflectionCard()+html.slice(at):beforeLastMain(html,reflectionCard())});
function reflSummary(){const list=refl();return list.length?`<h3 class="sub">Reflection questions (${list.length}) · not graded</h3>${list.map((r,i)=>`<div class="qline"><span class="qnum">R${i+1}</span><div><p>${esc(r.prompt||'Untitled reflection question')}</p>${r.about&&itemNo(state.items,r.about)?`<small class="muted">About item ${itemNo(state.items,r.about)}</small>`:''}</div><span class="chip">${r.type==='mc'?'Multiple choice':'Open response'}</span><span class="chip">Not graded</span></div>`).join('')}`:''}
wrapPage('pageConfirm',html=>{const at=html.indexOf('</section>\n<section class="card"><div class="row"><h2>Audience and sessions');return at>0?html.slice(0,at)+reflSummary()+html.slice(at):html});
if(typeof versionsCard==='function'){const baseVersions=versionsCard;versionsCard=function(){const n=refl().length;return baseVersions().replace('</ul>',n?`<li><span>Reflection questions</span><strong>${n} · not graded</strong></li></ul>`:'</ul>')}}
const baseAssignNow=assignNow;
assignNow=function(){baseAssignNow();if(state.results&&!state.results.reflections){state.results.reflections=clone(refl());save()}};

// Student preview: a reflection page after the last item.
function answerRefl(id,v){(state.student.reflect||(state.student.reflect={}))[id]=v;render()}
function noteRefl(id,v){(state.student.reflect||(state.student.reflect={}))[id]=v;save()}
(function(){const base=pageStudent,neu=function(){const list=refl(),n=state.items.length,want=state.student.q;if(!list.length||!n)return base();
const onRefl=want>=n;if(onRefl)state.student.q=n-1;let html=base();state.student.q=want;const ans=state.student.reflect||{};
const dots=`<nav class="qdots" aria-label="Go to a question">${state.items.map((x,i)=>`<button class="${!onRefl&&i===want?'current':''} ${state.student.answers[x.id]!==undefined?'answered':''}" ${!onRefl&&i===want?'aria-current="true"':''} onclick="setQ(${i})">${i+1}</button>`).join('')}<button class="refl-dot ${onRefl?'current':''} ${list.some(r=>ans[r.id]!==undefined&&ans[r.id]!=='')?'answered':''}" ${onRefl?'aria-current="true"':''} onclick="setQ(${n})">Reflect</button></nav>`;
html=html.replace(/<nav class="qdots"[\s\S]*?<\/nav>/,dots);
if(!onRefl)return html.replace(`<button class="btn primary" onclick="toast('Prototype: answers are not submitted.')">Review answers</button>`,`<button class="btn primary" onclick="setQ(${n})">Next: Reflect →</button>`);
const body=`<section class="card sq-card refl-student"><div class="eyebrow">Tell us your thinking</div><p class="hint">These questions are not graded. There are no right or wrong answers.</p>
${list.map((r,i)=>`<div class="refl-q"><p class="sq-stem"><span class="qnum">${i+1}</span> ${esc(r.prompt||'Untitled reflection question')}</p>${r.about&&itemNo(state.items,r.about)?`<details class="passage-peek"><summary>Look back at item ${itemNo(state.items,r.about)}</summary><p>${esc(state.items.find(it=>it.id===r.about).stem)}</p></details>`:''}
${r.type==='mc'?r.choices.map((c,k)=>`<button class="sq-option ${ans[r.id]===k?'picked':''}" aria-pressed="${ans[r.id]===k}" onclick="answerRefl('${r.id}',${k})"><b>${IA.letters[k]||k+1}</b><span>${esc(c)}</span></button>`).join(''):`<textarea class="sq-response" rows="3" aria-label="Your answer" placeholder="Type your thinking" oninput="noteRefl('${r.id}',this.value)">${esc(typeof ans[r.id]==='string'?ans[r.id]:'')}</textarea>`}</div>`).join('')}</section>
<div class="sq-foot"><button class="btn" onclick="setQ(${n-1})">← Previous</button><span class="small muted">Your answers save as you go</span><button class="btn primary" onclick="toast('Prototype: answers are not submitted.')">Review answers</button></div></main>`;
return html.replace(/<section class="card sq-card">[\s\S]*$/,body)};
Object.keys(ROUTES).forEach(k=>{if(ROUTES[k]===base)ROUTES[k]=neu});pageStudent=neu})();
setQ=function(i){state.student.q=i;render();window.scrollTo(0,0)};

// Simulated reflection responses, loosely tied to each student's score so the patterns are worth reading.
const REFL_VOICE={'Adds numerators and adds denominators':['I added the top numbers and then added the bottom numbers.','I added straight across, tops and bottoms.','I added the numerators and the denominators like regular numbers.'],'Uses a common denominator without rewriting the numerators':['I made the bottoms the same and then added the tops.','I changed the bottom to 12 but kept the top numbers.'],'Subtracts the smaller fraction from the larger instead of regrouping':['I took the smaller fraction away from the bigger one so I didn’t have to borrow.','I flipped the fractions so I could subtract.'],'Adds numerators and multiplies denominators':['I multiplied the bottoms and added the tops.'],'Uses only one of the quantities':['I only used one of the numbers in the problem.'],
'Chooses a detail instead of the main idea':['I picked the part about the hives because it was in the passage.','That sentence was in the text, so I thought it was the main idea.'],'Chooses an idea not stated in the text':['It sounded right, so I picked it.','I thought about what I already know about bees.'],'Chooses a true detail that does not answer the question':['I found that sentence in the passage, so I chose it.','It was true in the story so I picked it.'],'Uses the everyday meaning instead of context':['I used what the word usually means.','I knew that word from before so I didn’t check the paragraph.'],'Chooses the topic instead of the theme':['The story was about running, so I picked running.','I picked what the story was about.'],'Overgeneralizes from one detail':['It said that once, so I thought it was always true.']};
const REFL_RIGHT={math:['I found a common denominator first, then added the numerators.','I drew fraction bars to check that my answer made sense.','I changed both fractions to twelfths, then added.','I estimated first so I knew the answer should be close to 1.'],ela:['I went back to the passage and found the sentence that proved it.','I asked myself what the whole passage was mostly about.','I crossed out answers that were only small details.','I read the words around it to figure out what it meant.']};
const REFL_WRONG={math:'I wasn’t sure, so I picked the answer that looked closest.',ela:'I picked the one that sounded right without going back to the passage.'};
const REFL_GENERAL={math:['The word problems were hardest because I had to figure out what to do first.','Mixed numbers were tricky when I had to borrow.','I felt good about adding but not subtracting.','Nothing was too hard. I checked my work at the end.','I would draw a model next time before picking an answer.'],ela:['The theme question was hard because a lot of answers sounded true.','I liked the story but the vocabulary question was confusing.','I would reread the passage before answering next time.','Finding the main idea was easier than finding the theme.','I ran out of time at the end.']};
function reflPick(name,id,n){return hashOf(name+id)%n}
function simulateReflections(){const r=state.results;if(!r||!r.responses)return;const list=r.reflections||[],d=resultsData(),subj=r.items.some(it=>ELA.isELA(it))?'ela':'math';r.reflect={};
d.students.forEach(s=>{r.reflect[s.name]={};list.forEach(q=>{let a;const it=q.about&&r.items.find(x=>x.id===q.about),resp=it&&r.responses[s.name][it.id];
if(q.type==='mc'){const k=q.choices.length,scale=q.choices.join('|')===REFL_SCALE.join('|');a=scale?Math.min(k-1,Math.max(0,(s.pct>=80?0:s.pct>=60?1:2)+(reflPick(s.name,q.id,5)===0?1:0)-(reflPick(s.name,q.id,7)===0?1:0))):reflPick(s.name,q.id,Math.max(1,k))}
else if(it){const right=resp&&resp.earned===+it.marks,label=it.type==='mc'&&!right?(it.rationales[resp.choice]||'').trim():'';const v=REFL_VOICE[label];a=right?REFL_RIGHT[subj][reflPick(s.name,q.id,REFL_RIGHT[subj].length)]:v?v[reflPick(s.name,q.id,v.length)]:REFL_WRONG[subj]}
else a=REFL_GENERAL[subj][reflPick(s.name,q.id,REFL_GENERAL[subj].length)];
r.reflect[s.name][q.id]=a})})}
const baseSimulate=simulate;
simulate=function(){baseSimulate();simulateReflections();save();render()};

// Results: a separate "Student thinking" tab, linked both ways with the By item view.
function openThinking(id){state.resultsTab='thinking';render();document.getElementById(id?'refl-'+id:'insights')?.scrollIntoView({behavior:'smooth'})}
function openItemResults(qi){state.resultsTab='questions';render();document.getElementById('item-res-'+qi)?.scrollIntoView({behavior:'smooth'})}
function thinkingView(d){const r=state.results,list=r.reflections,names=r.students;if(!r.reflect)simulateReflections();const ans=r.reflect,pctOf=Object.fromEntries(d.students.map(s=>[s.name,s.pct]));
return `<div class="banner neutral">Reflection questions are not graded. Responses here don’t change any score.</div>
${list.map((q,i)=>{const qi=q.about?r.items.findIndex(it=>it.id===q.about):-1,it=qi>=0?r.items[qi]:null;
const head=`<div class="row"><div><div class="eyebrow">Reflection R${i+1} · ${q.type==='mc'?'Multiple choice':'Open response'}${it?` · About item ${qi+1}`:' · Whole test'}</div><p class="qstem">${esc(q.prompt)}</p></div>${it?`<button class="btn-link" onclick="openItemResults(${qi})">View item ${qi+1} results →</button>`:''}</div>`;
if(q.type==='mc'){const rows=q.choices.map((c,k)=>{const who=names.filter(n=>ans[n][q.id]===k),avg=who.length?Math.round(who.reduce((s,n)=>s+pctOf[n],0)/who.length):null;return {c,k,who,avg}});
return `<section class="card" id="refl-${q.id}">${head}<table class="table refl-table"><thead><tr><th>Choice</th><th>Students</th><th></th><th>Average score</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.c)}</td><td>${x.who.length}</td><td class="tcell-bar"><div class="optbar"><div style="width:${names.length?x.who.length/names.length*100:0}%"></div></div><div class="small muted">${x.who.map(esc).join(', ')}</div></td><td>${x.avg==null?'—':x.avg+'%'}</td></tr>`).join('')}</tbody></table>
<p class="small muted">Average score shows how students who chose each answer did on the graded items.</p></section>`}
return `<section class="card" id="refl-${q.id}">${head}<ul class="refl-answers">${names.map(n=>{const resp=it&&r.responses[n][it.id],right=resp&&resp.earned===+it.marks;
return `<li><div class="refl-who"><strong>${esc(n)}</strong>${it?(right?'<span class="chip success">Correct on item '+(qi+1)+'</span>':`<span class="chip warning">${it.type==='mc'?'Chose '+IA.letters[resp.choice]+' on item '+(qi+1):'Partial or no credit'}</span>`):''}</div><p>${esc(ans[n][q.id]||'No response')}</p></li>`}).join('')}</ul></section>`}).join('')}
<section class="card"><h2>By student</h2><table class="table"><thead><tr><th>Student</th><th>Score</th>${list.map((q,i)=>`<th>R${i+1}</th>`).join('')}</tr></thead><tbody>${d.students.map(s=>`<tr><td>${esc(s.name)}</td><td>${s.pct}%</td>${list.map(q=>{const a=ans[s.name][q.id];return `<td class="small">${esc(q.type==='mc'?q.choices[a]??'—':a||'—')}</td>`}).join('')}</tr>`).join('')}</tbody></table></section>`}
const baseQuestionsView=questionsView;
questionsView=function(d){const r=state.results,list=r.reflections||[];return baseQuestionsView(d).split('<section class="card">').map((part,k)=>{if(!k)return part;const qi=k-1,it=r.items[qi],about=list.map((q,i)=>({q,i})).filter(x=>x.q.about===it.id);
const link=about.length?`<div class="refl-link">${about.map(x=>`<button class="btn-link" onclick="openThinking('${x.q.id}')">💬 Student thinking about this item (R${x.i+1}) →</button>`).join('')}</div>`:'';return `<section class="card" id="item-res-${qi}">`+part.replace(/<\/section>$/,link+'</section>')}).join('')};
wrapPage('pageResults',html=>{const r=state.results;if(!r||!r.responses||!(r.reflections||[]).length)return html;
const on=state.resultsTab==='thinking',tabs=[['misconceptions','Misconceptions'],['standards',alabama()?KG.state+' standards':'By standard'],['components','Learning components'],['questions','By item'],['thinking','Student thinking']],cur=on?'thinking':['components','standards','questions'].includes(state.resultsTab)?state.resultsTab:'misconceptions';
html=html.replace(/<div class="seg results-tabs" role="tablist">[\s\S]*?<\/div>/,`<div class="seg results-tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" aria-selected="${cur===k}" class="${cur===k?'on':''}" onclick="setResultsTab('${k}')">${l}${k==='thinking'?' <span class="chip">Not graded</span>':''}</button>`).join('')}</div>`);
if(!on)return html;const a=html.indexOf('<div class="seg results-tabs"'),end=html.indexOf('</div></div>',a)+12,b=html.indexOf('<section class="card"><div class="row"><h2>Student results');
return html.slice(0,end)+'\n'+thinkingView(resultsData())+'</section>\n'+html.slice(b)});

refl();render();

</script>
</body>
